[package]
name = "system-faas-node-registry"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
wit-bindgen = "0.57"
# Pure-Rust (wasm-safe) RS256 JWT verification for machine-identity enrollment.
rsa = "0.9"
sha2 = { version = "0.11", features = ["oid"] }
base64 = "0.22"

[dev-dependencies]
# Host-only: RNG for generating a test RSA key in the RS256 round-trip test.
rand = "0.8"
