[package]
name = "system-faas-cert-manager"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.57"
# Pure-Rust (wasm-safe) ed25519 signing for cluster-CA node credentials.
ed25519-dalek = { version = "2", default-features = false }
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rcgen = "0.14"
