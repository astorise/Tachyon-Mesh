## Tachyon Mesh — GPU Homelab Deployment
## Requires: NVIDIA GPU node with device plugin, NFS/local-path storage
## Usage:   kubectl apply -f manifests/deploy-gpu.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: tachyon

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tachyon-model-pvc
  namespace: tachyon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # Change storageClassName to match your cluster (e.g. local-path, nfs-client)
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tachyon-core-host
  namespace: tachyon
  labels:
    app: tachyon-core-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tachyon-core-host
  template:
    metadata:
      labels:
        app: tachyon-core-host
    spec:
      # Force scheduling on nodes that have an NVIDIA GPU.
      # Adjust the label selector to match your cluster's GPU labelling.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      # ── Pod-level security context (Restricted Pod Security Standard) ──────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      # A ConfigMap volume mounts read-only, but core-host's manifest path
      # also anchors every state directory it derives (auth state, core
      # store, buffered-request spool, host identity key) — those need a
      # writable parent. This copies the ConfigMap's integrity.lock into the
      # writable state-vol emptyDir once at pod start, so the main container
      # can point TACHYON_INTEGRITY_MANIFEST at a location that is both
      # pre-populated with the real signed manifest and writable.
      initContainers:
        - name: copy-integrity-lock
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp /config/integrity.lock /state/integrity.lock
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: integrity-lock
              mountPath: /config
              readOnly: true
            - name: state-vol
              mountPath: /state

      containers:
        - name: core-host
          image: ghcr.io/astorise/tachyon-mesh:latest
          imagePullPolicy: Always

          # ── Container-level security context ──────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Expose GPU to the runtime
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            # Bind address
            - name: TACHYON_HOST_ADDRESS
              value: "0.0.0.0:8080"
            # See the copy-integrity-lock init container above: this is the
            # writable copy it makes of the ConfigMap-sourced manifest.
            - name: TACHYON_INTEGRITY_MANIFEST
              value: /state/integrity.lock
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /var/lib/tachyon/models
            - name: state-vol
              mountPath: /state
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: tachyon-model-pvc
        - name: integrity-lock
          configMap:
            name: tachyon-integrity-lock
        # Writable copy the init container populates from the read-only
        # ConfigMap above; also anchors core-host's derived state
        # directories. Ephemeral (no PVC): this Deployment has none today,
        # matching its behavior before this change.
        - name: state-vol
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: tachyon-service
  namespace: tachyon
spec:
  selector:
    app: tachyon-core-host
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

---
# ServiceMonitor for Prometheus / kube-prometheus-stack
# Requires the prometheus-operator CRDs. Remove if not using Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tachyon-metrics
  namespace: tachyon
  labels:
    # Adjust to match your Prometheus operator's serviceMonitorSelector
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: tachyon-core-host
  endpoints:
    - port: http
      path: /admin/metrics
      interval: 30s
      # Bearer token for /admin/* endpoints
      bearerTokenSecret:
        name: tachyon-admin-token
        key: token
