## Tachyon Mesh — GPU Homelab Deployment
## Requires: NVIDIA GPU node with device plugin, NFS/local-path storage
## Usage:   kubectl apply -f manifests/deploy-gpu.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: tachyon

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tachyon-model-pvc
  namespace: tachyon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # Change storageClassName to match your cluster (e.g. local-path, nfs-client)
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tachyon-core-host
  namespace: tachyon
  labels:
    app: tachyon-core-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tachyon-core-host
  template:
    metadata:
      labels:
        app: tachyon-core-host
    spec:
      # Force scheduling on nodes that have an NVIDIA GPU.
      # Adjust the label selector to match your cluster's GPU labelling.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: core-host
          image: ghcr.io/astorise/tachyon-mesh:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Expose GPU to the runtime
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            # Bind address
            - name: TACHYON_HOST_ADDRESS
              value: "0.0.0.0:8080"
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /var/lib/tachyon/models
            - name: integrity-lock
              mountPath: /app/integrity.lock
              subPath: integrity.lock
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: tachyon-model-pvc
        - name: integrity-lock
          configMap:
            name: tachyon-integrity-lock

---
apiVersion: v1
kind: Service
metadata:
  name: tachyon-service
  namespace: tachyon
spec:
  selector:
    app: tachyon-core-host
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

---
# ServiceMonitor for Prometheus / kube-prometheus-stack
# Requires the prometheus-operator CRDs. Remove if not using Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tachyon-metrics
  namespace: tachyon
  labels:
    # Adjust to match your Prometheus operator's serviceMonitorSelector
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: tachyon-core-host
  endpoints:
    - port: http
      path: /admin/metrics
      interval: 30s
      # Bearer token for /admin/* endpoints
      bearerTokenSecret:
        name: tachyon-admin-token
        key: token
