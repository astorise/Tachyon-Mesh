## Tachyon Mesh — Hardened GPU Homelab Deployment
## Implements Pod Security Standards (Restricted) + NetworkPolicy zero-trust perimeter.
## For Enterprise and highly-regulated environments.
## Requires: NVIDIA GPU node with device plugin, NFS/local-path storage, Kubernetes >= 1.25
## Usage:   kubectl apply -f manifests/deploy-gpu-homelab-hardened.yaml

---
# Dedicated ServiceAccount — least-privilege identity for Tachyon pods.
# No automounted token; add RoleBindings here if the workload needs cluster API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tachyon-sa
  namespace: tachyon
automountServiceAccountToken: false

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tachyon-model-pvc
  namespace: tachyon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tachyon-core-host
  namespace: tachyon
  labels:
    app: tachyon-core-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tachyon-core-host
  template:
    metadata:
      labels:
        app: tachyon-core-host
    spec:
      serviceAccountName: tachyon-sa
      automountServiceAccountToken: false

      # ── Pod-level security context (Restricted PSS) ─────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: core-host
          image: ghcr.io/astorise/tachyon-mesh:latest
          imagePullPolicy: Always

          # ── Container-level security context ──────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: TACHYON_HOST_ADDRESS
              value: "0.0.0.0:8080"

          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: tmp-vol
              mountPath: /tmp
            - name: model-cache
              mountPath: /var/lib/tachyon/models
            - name: integrity-lock
              mountPath: /app/integrity.lock
              subPath: integrity.lock

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

      volumes:
        # /tmp writable scratch space required by readOnlyRootFilesystem: true
        - name: tmp-vol
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: tachyon-model-pvc
        - name: integrity-lock
          configMap:
            name: tachyon-integrity-lock

---
apiVersion: v1
kind: Service
metadata:
  name: tachyon-service
  namespace: tachyon
spec:
  selector:
    app: tachyon-core-host
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

---
# ── NetworkPolicy — zero-trust perimeter ────────────────────────────────────
# Default-deny-all; explicitly allows only the required traffic flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tachyon-network-policy
  namespace: tachyon
spec:
  podSelector:
    matchLabels:
      app: tachyon-core-host
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow inbound API/MCP traffic on port 8080
    - ports:
        - protocol: TCP
          port: 8080
    # Allow Prometheus scraping on the same port (/admin/metrics)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # DNS resolution (UDP + TCP for large responses)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server (HTTPS) and external artifact fetches
    - ports:
        - protocol: TCP
          port: 443

---
# ServiceMonitor for Prometheus / kube-prometheus-stack
# Requires the prometheus-operator CRDs. Remove if not using Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tachyon-metrics
  namespace: tachyon
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: tachyon-core-host
  endpoints:
    - port: http
      path: /admin/metrics
      interval: 30s
      bearerTokenSecret:
        name: tachyon-admin-token
        key: token
