# Shared HS256 signing secret. Every mesh node must use the SAME value so that
# identity tokens issued by one node validate on the others. Without this the
# host generates a per-node random secret (fail-secure but not shareable).
# REPLACE this example value before production — source it from a real secret
# manager (e.g. sealed-secrets, External Secrets, Vault) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: tachyon-mesh-auth
type: Opaque
stringData:
  jwt-secret: "CHANGE-ME-shared-mesh-jwt-secret-0123456789abcdef"
---
apiVersion: v1
kind: Service
metadata:
  name: tachyon-mesh
spec:
  clusterIP: None
  selector:
    app: tachyon-mesh
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tachyon-mesh-lb
spec:
  selector:
    app: tachyon-mesh
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tachyon-mesh
spec:
  serviceName: tachyon-mesh
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tachyon-mesh
  template:
    metadata:
      labels:
        app: tachyon-mesh
    spec:
      # ── Pod-level security context (Restricted Pod Security Standard) ──────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: core-host
          image: ghcr.io/astorise/tachyon-mesh:latest
          imagePullPolicy: Always

          # ── Container-level security context ──────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TACHYON_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tachyon-mesh-auth
                  key: jwt-secret
            # readOnlyRootFilesystem: true means core-host's default manifest
            # path ("integrity.lock", relative to /app — not writable here)
            # can no longer double as the anchor for every state directory
            # derived from it (auth state, core store, buffered-request
            # spool, host identity key — see manifests/deploy.yaml for the
            # same fix). This mesh StatefulSet already has a durable PVC
            # mounted at /app/data, so state lands there instead of an
            # ephemeral /tmp.
            - name: TACHYON_INTEGRITY_MANIFEST
              value: /app/data/integrity.lock
          volumeMounts:
            - name: tachyon-store
              mountPath: /app/data
            # readOnlyRootFilesystem: true also removes the writable /tmp
            # core-host's UDS peer-discovery registry defaults to
            # (/tmp/tachyon/peers) — sockets, so kept off the tachyon-store
            # PVC deliberately: some storage classes (e.g. NFS) don't
            # support UNIX sockets, while local emptyDir always does.
            - name: tmp-vol
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tmp-vol
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: tachyon-store
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 256Mi
