# Shared HS256 signing secret. Every mesh node must use the SAME value so that
# identity tokens issued by one node validate on the others. Without this the
# host generates a per-node random secret (fail-secure but not shareable).
# REPLACE this example value before production — source it from a real secret
# manager (e.g. sealed-secrets, External Secrets, Vault) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: tachyon-mesh-auth
type: Opaque
stringData:
  jwt-secret: "CHANGE-ME-shared-mesh-jwt-secret-0123456789abcdef"
---
apiVersion: v1
kind: Service
metadata:
  name: tachyon-mesh
spec:
  clusterIP: None
  selector:
    app: tachyon-mesh
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tachyon-mesh-lb
spec:
  selector:
    app: tachyon-mesh
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tachyon-mesh
spec:
  serviceName: tachyon-mesh
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tachyon-mesh
  template:
    metadata:
      labels:
        app: tachyon-mesh
    spec:
      containers:
        - name: core-host
          image: ghcr.io/astorise/tachyon-mesh:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TACHYON_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tachyon-mesh-auth
                  key: jwt-secret
          volumeMounts:
            - name: tachyon-store
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: tachyon-store
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 256Mi
