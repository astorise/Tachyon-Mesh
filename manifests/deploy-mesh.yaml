apiVersion: v1
kind: Service
metadata:
  name: tachyon-mesh
spec:
  clusterIP: None
  selector:
    app: tachyon-mesh
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tachyon-mesh-lb
spec:
  selector:
    app: tachyon-mesh
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tachyon-mesh
spec:
  serviceName: tachyon-mesh
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tachyon-mesh
  template:
    metadata:
      labels:
        app: tachyon-mesh
    spec:
      containers:
        - name: core-host
          image: ghcr.io/astorise/tachyon-mesh:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: tachyon-store
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: tachyon-store
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 256Mi
