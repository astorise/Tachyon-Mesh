[package]
name = "tachyon-mcp"
version = "1.0.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyon-client = { path = "../tachyon-client" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

tracing = "0.1"

[dev-dependencies]
serde_json = "1"
