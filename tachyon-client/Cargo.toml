[package]
name = "tachyon-client"
version = "1.0.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
flate2 = "1"
hex = "0.4"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.39"
tar = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync"] }
# reqwest::Url is a re-export of url::Url, but not of url::Host — declared
# directly here so `allows_insecure_local_tls` can match on it. Already in
# the lockfile transitively via reqwest, so this pins no new version.
url = "2.5"
