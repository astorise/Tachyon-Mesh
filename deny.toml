[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
# `cargo deny check advisories` fails on any entry here it doesn't actually
# encounter in the current dependency graph (`advisory-not-detected` /
# `yanked-not-detected`) — useful (it means an entry's own "remove once
# fixed" note has come due), but it also means this list can only hold what
# `cargo deny` itself currently needs, not everything `cargo audit` ignores
# too (RUSTSEC-2024-0429 lives in .cargo/audit.toml instead, for exactly
# that reason — see the comment there). Two entries were found stale this
# way while fixing #428 and are already gone: RUSTSEC-2026-0204
# (crossbeam-epoch — already at 0.9.21, past the advisory's own >=0.9.20
# fix) and the chacha20@0.10.0 yank (fixed by bumping to the non-yanked
# 0.10.2, `cargo update -p chacha20@0.10.0 --precise 0.10.2`).
# TACH-49 (2026-10-30 audit): dated review ledger for every ignore entry
# below (and .cargo/audit.toml's, which this file's own comment above
# explains can't live here) -- "added" dates are each entry's real first
# commit (`git log -S"<id>" -- deny.toml .cargo/audit.toml`), not guessed.
# "Review by" is the sooner of: 6 months after it was added or last
# reviewed, or the next Renovate PR that bumps the dependency chain named
# in its reason (Renovate already runs on a schedule and opens a PR for
# any such bump on its own -- that PR is a real trigger to re-run `cargo
# audit`/`cargo deny check advisories` against the new version, not a
# second tracking mechanism to maintain by hand). Single-maintainer repo,
# so every entry's owner is astorise; re-date an entry's "added" (and move
# the clock forward) each time it's actually re-reviewed and still holds.
#
# - RUSTSEC-2023-0071: added 2026-07-19. Review by 2027-01-19 or the next
#   Renovate PR touching `rsa`, whichever comes first.
# - RUSTSEC-2026-0367/0368/0369: added 2026-10-17. Review by 2027-04-17 or
#   the next Renovate PR touching `zip`/`libsodium-sys-stable`, whichever
#   comes first.
# - RUSTSEC-2026-0387: added 2026-10-25. Review by 2027-04-25 or the next
#   Renovate PR touching `crypto-bigint`/`elliptic-curve`/`k256`/
#   `iota-crypto`/`iota_stronghold`, whichever comes first.
# - RUSTSEC-2024-0429 (.cargo/audit.toml): added 2026-09-18. Review by
#   2027-03-18 or the next Renovate PR touching `glib`, whichever comes
#   first.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing side-channel applies to RSA private-key decryption; system-faas-node-registry uses rsa only for RS256 JWT signature VERIFICATION with public keys (no private-key ops), so it is not exploitable here. No fixed rsa release is available yet." },
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 is only a build-dependency of libsodium-sys-stable (via iota_stronghold -> tachyon-ui) used to unpack the pinned libsodium source archive at build time; no attacker-controlled archive is extracted and nothing runs at runtime. Blocked on libsodium-sys-stable moving to zip >=9." },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 is only a build-dependency of libsodium-sys-stable (via iota_stronghold -> tachyon-ui) used to unpack the pinned libsodium source archive at build time; no attacker-controlled archive is extracted and nothing runs at runtime. Blocked on libsodium-sys-stable moving to zip >=9." },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 is only a build-dependency of libsodium-sys-stable (via iota_stronghold -> tachyon-ui) used to unpack the pinned libsodium source archive at build time; no attacker-controlled archive is extracted and nothing runs at runtime. Blocked on libsodium-sys-stable moving to zip >=9." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing side-channel, via iota_stronghold -> iota-crypto -> k256 -> elliptic-curve 0.13.8 (tachyon-ui's secret-storage dependency, not the headless core-host runtime path). elliptic-curve 0.13.8 pins crypto-bigint = \"^0.5\"; no release of elliptic-curve/k256/iota-crypto/iota_stronghold using the patched crypto-bigint 0.7.x line exists yet. The separate crypto-bigint 0.7.5 instance (system-faas-cert-manager's p256/ecdsa chain) is fixed directly by bumping to 0.7.6 and is not what this entry covers." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "warn"
deny = [
    { name = "native-tls", wrappers = ["ureq"], reason = "Only the ort-sys build-time ONNX Runtime downloader currently requires ureq/native-tls; runtime TLS must use rustls." },
    { name = "openssl", wrappers = ["native-tls"], reason = "Only allowed behind the ort-sys build-time ureq/native-tls downloader; runtime TLS must use rustls." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/apache/arrow-rs-object-store.git",
    "https://github.com/ebarnard/rust-plist.git",
]
