name: Verify tag CI baseline

# TACH-17/TACH-18: shared by every workflow that can publish something real
# off a `v*` tag (release.yml, publish-sdks.yml). A tag can point at any
# commit, including one that never ran CI's push trigger or ran it and
# failed -- this repo's rulesets gate merges into `main`, not tag creation.
# Factored out of release.yml (where this job originated) so both
# workflows share one script instead of drifting apart.
on:
  workflow_call:
    inputs:
      target_sha:
        description: >-
          Commit SHA to verify CI for. Optional -- defaults to the caller's
          own github.sha, which is already correct for a tag-push trigger
          (the push itself IS the tagged commit). Pass this explicitly
          (TACH-32, 2026-10-29 audit) when the caller can be dispatched from
          an arbitrary ref -- e.g. a `workflow_dispatch` -- where
          github.sha reflects whatever ref the run happened to be started
          from, not necessarily the exact tag being acted on.
        required: false
        type: string

jobs:
  verify-tag-ci-green:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the tagged commit's CI baseline to be green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          # TACH-35 (2026-10-29 audit): installer-contract-smoke-test-linux/
          # -windows (TACH-30) catch exactly the archive-layout regressions
          # TACH-27/TACH-31 fixed -- without them in this required list, a
          # future commit could break the Zero-Build installer contract
          # without ever blocking a tag.
          required="quality cuda-quality security-audit build-guests installer-contract-smoke-test-linux installer-contract-smoke-test-windows"

          # Resolve the exact CI run that proves this: a `push` trigger on
          # `main`, for this exact commit -- never a `pull_request` run.
          # ci.yml's Renovate-PR lane (RENOVATE_PR, gated on
          # github.event_name == 'pull_request') skips boundary validation
          # and GPU execution tests while still reporting these same job
          # names as successful, so matching by check-run name alone (the
          # first version of this gate) could accept a PR run's checks for
          # a commit that never ran the real push baseline on main.
          run_id=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&status=completed" \
            -q '.workflow_runs[0].id // empty')

          if [ -z "$run_id" ]; then
            echo "::error::No completed CI push run on main exists for tagged commit ${SHA} -- tag a commit that has already run CI's push trigger on main, not just a pull_request run." >&2
            exit 1
          fi

          # TACH-43 (2026-10-30 audit): the API query above filters on
          # `status=completed` -- a run is "completed" the instant every
          # job in it has finished, successfully or not. Nothing above
          # this point ever looks at the run's own `conclusion`. Checking
          # only the six named jobs below means a run where `test`, `ui`,
          # a FIPS/feature-matrix job, or any job outside this list failed
          # -- while these six happened to pass independently, since none
          # of them depend on those others -- would satisfy every check
          # below and authorize create-draft-release, the WIT/binary
          # publishes, and finalize-release off a CI run that was actually
          # red. Requiring the run's overall conclusion to be `success`
          # first closes that gap; the six-job loop stays as defense in
          # depth (TACH-35's own reasoning for why job names, not just an
          # overall conclusion, matter: a run can conclude `success` while
          # genuinely omitting a job that was never scheduled for this ref
          # at all, e.g. if ci.yml's own triggers change in the future).
          run_conclusion=$(gh api "repos/${REPO}/actions/runs/${run_id}" -q '.conclusion // empty')
          if [ "$run_conclusion" != "success" ]; then
            echo "::error::CI push run ${run_id} on main for ${SHA} concluded '${run_conclusion}', not 'success' -- refusing to treat this commit's CI as green even though the six required jobs below may individually show success." >&2
            exit 1
          fi

          missing=""
          failed=""
          for name in $required; do
            conclusion=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs" \
              --paginate \
              -q ".jobs[] | select(.name == \"${name}\") | .conclusion" \
              | tail -n1)
            if [ -z "$conclusion" ] || [ "$conclusion" = "null" ]; then
              missing="${missing} ${name}"
            elif [ "$conclusion" != "success" ]; then
              failed="${failed} ${name}=${conclusion}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::CI push run ${run_id} on main for ${SHA} is missing required job(s):${missing}." >&2
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::error::CI push run ${run_id} on main for ${SHA} has failing required job(s):${failed}" >&2
            exit 1
          fi
          echo "All required jobs are green on CI push run ${run_id} (commit ${SHA}): ${required}"
