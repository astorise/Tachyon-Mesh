name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR/feature branches, but never on main:
  # publish-docker-images pushes mutable latest* tags, and cancelling a run
  # mid-publish could leave GHCR with latest* tags from mixed commits. The
  # group still serializes main runs, so a new push waits instead of killing
  # an in-flight publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ── Shared env snippets used across multiple jobs ─────────────────────────────
# RUSTFLAGS and CARGO_TERM_COLOR are repeated per-job so each job's env block
# is self-contained and readable without cross-referencing.

# ── Renovate compile-only fast lane ──────────────────────────────────────────
# Dependency-update PRs (head branch `renovate/**`) only need to prove the tree
# still compiles; the full lint/test/GPU suite made them impossible to merge
# because cuda-quality queues on the resource-limited arc-gpu-runners. On these
# PRs the four required checks (build-guests, security-audit, quality,
# cuda-quality) still run but quality/cuda-quality drop to `cargo check`,
# fips-tests becomes a compile check, and every other job is skipped outright
# (a `skipped` job conclusion satisfies branch protection). Detection uses the
# head branch prefix — not the actor — so a human re-running or pushing a fix
# to a Renovate branch stays in the same lane.

jobs:
  # ── 1. Build WASM guest artifacts once ──────────────────────────────────────
  # Packs with tar to preserve target/wasm32-wasip*/release/ paths exactly.
  # All downstream jobs unpack instead of rebuilding (~12-15 min each).
  build-guests:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-guests

      - name: Build guest artifacts
        run: bash scripts/build-guest-artifacts.sh

      - name: Pack guest artifacts
        run: tar -czf wasm-guests.tar.gz target/wasm32-wasip1/release/*.wasm target/wasm32-wasip2/release/*.wasm

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-guests-${{ github.sha }}
          path: wasm-guests.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Pack example guest modules
        run: |
          tar --transform 's|.*/||' -czf guest-examples.tar.gz \
            target/wasm32-wasip1/release/guest_*.wasm \
            target/wasm32-wasip2/release/guest_*.wasm \
            examples/guest-examples/manifest.json

      - name: Upload example guest modules archive
        uses: actions/upload-artifact@v7
        with:
          name: guest-examples-${{ github.sha }}
          path: guest-examples.tar.gz
          if-no-files-found: error
          retention-days: 90

  # ── 1b. Docker layer cache warm-up (runs in parallel with build-guests) ─────
  # Pre-builds the shared builder stages of Dockerfile / Dockerfile.fips /
  # Dockerfile.e2e (apt+rustup setup, cargo-chef `planner`/cook layers — see
  # the `chef`/`planner`/`*-builder` stages) and exports them with
  # `cache-to: type=gha,mode=max`. This warms the docker-default, docker-fips
  # and docker-e2e-slim scopes BEFORE publish-docker-images' 5-way matrix and
  # the e2e-mesh/e2e-k8s/integration/e2e-zero-touch workflows read from them
  # (all triggered by this same push to main), so the shared ~16-package
  # dependency compile happens once instead of cold-starting in parallel
  # everywhere.
  # `outputs: type=cacheonly` skips producing a loadable image — only the
  # layer cache is exported. `continue-on-error: true` makes this strictly
  # best-effort: a warm-up failure just leaves a scope cold (today's
  # behavior), it never blocks publish-docker-images.
  docker-base:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ./Dockerfile splits its builder into a feature-independent
          # wasm-builder (shared by every variant) and a feature-dependent
          # host-builder; warming host-builder with empty features still
          # populates its pre-ARG default core-host / FaaS dependency cooks,
          # which all variants share. Both feed the same docker-default scope.
          - dockerfile: ./Dockerfile
            target: wasm-builder
            cache_scope: docker-default
          - dockerfile: ./Dockerfile
            target: host-builder
            cache_scope: docker-default
          - dockerfile: ./Dockerfile.e2e
            target: rust-builder
            cache_scope: docker-e2e-slim
          - dockerfile: ./Dockerfile.fips
            target: wasm-builder
            cache_scope: docker-fips
          - dockerfile: ./Dockerfile.fips
            target: fips-builder
            cache_scope: docker-fips
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warm ${{ matrix.cache_scope }} cache (${{ matrix.dockerfile }} → ${{ matrix.target }})
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  # ── 2. Security audit (runs in parallel with build-guests) ──────────────────
  security-audit:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Run cargo audit
        # RUSTSEC-2023-0071 (rsa Marvin attack) targets RSA private-key
        # decryption timing; we only verify JWT signatures with public keys
        # (no private-key ops), so it does not apply. RUSTSEC-2024-0429 is in
        # glib's VariantStrIter; glib is present through the desktop/Tauri GTK
        # dependency tree, not the headless runtime path. RUSTSEC-2026-0204
        # (published 2026-07-06) is an invalid-pointer dereference in
        # crossbeam-epoch's `fmt::Pointer` impl for `Atomic`/`Shared`, reached
        # only by formatting those types for Debug/Display; Tachyon's
        # dependency tree never does that. Remove this ignore once a fixed
        # crossbeam-epoch (advisory says >=0.9.20) is picked up.
        run: >
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2026-0204

      - name: Run cargo deny
        run: cargo deny check advisories bans sources

  # Offline manifest schemas must stay compatible with the latest published
  # release unless a PR intentionally carries the breaking-manifest label.
  manifest-schema-compatibility:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      BREAKING_MANIFEST_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'breaking-manifest') }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate HEAD integrity schemas
        run: cargo run -p core-host -- schema --output-dir target/schemas-head

      - name: Download latest release integrity schemas
        id: previous
        shell: bash
        run: |
          tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName // ""')"
          if [ -z "$tag" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No previous release found; skipping manifest schema compatibility diff."
            exit 0
          fi
          mkdir -p target/schemas-prev
          if ! gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir target/schemas-prev \
            --pattern integrity-config.schema.json \
            --pattern integrity-lock.schema.json; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Latest release $tag has no integrity schema assets; skipping compatibility diff."
            exit 0
          fi
          if [ ! -f target/schemas-prev/integrity-config.schema.json ] || [ ! -f target/schemas-prev/integrity-lock.schema.json ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Latest release $tag does not include both integrity schema assets; skipping compatibility diff."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Check manifest schema compatibility
        if: steps.previous.outputs.found == 'true' && env.BREAKING_MANIFEST_LABEL != 'true'
        run: |
          node scripts/check-schema-compat.js target/schemas-prev/integrity-config.schema.json target/schemas-head/integrity-config.schema.json
          node scripts/check-schema-compat.js target/schemas-prev/integrity-lock.schema.json target/schemas-head/integrity-lock.schema.json

      - name: Acknowledge intentional manifest break
        if: steps.previous.outputs.found == 'true' && env.BREAKING_MANIFEST_LABEL == 'true'
        run: echo "breaking-manifest label present; schema compatibility diff is advisory for this PR."

  # Quality gate: fmt, clippy, cross-layer validation and per-feature compilation checks.
  quality:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
      # See "Renovate compile-only fast lane" at the top of this file.
      RENOVATE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            cmake \
            nasm \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler \
            mold
          # Make mold the default host linker (drop-in for /usr/bin/ld) so every
          # cargo link in this job is faster; wasm32 cross-links use rust-lld and
          # are unaffected, and RUSTFLAGS is untouched.
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: env.RENOVATE_PR != 'true'
        run: cargo fmt --all -- --check

      - name: Check core-host feature builds (compile-only)
        run: |
          for feature in \
            http3 \
            mtls \
            rate-limit \
            resiliency \
            s3-persistence \
            secrets-vault \
            websockets
          do
            cargo check -p core-host --features "$feature"
          done

      - name: Lint workspace (CPU features)
        # Keep the general quality gate on ubuntu-latest CPU runners: CUDA is
        # validated separately by the arc-gpu-runners job below. `--all-features`
        # would enable core-host/candle-cuda and require nvcc on this runner.
        if: env.RENOVATE_PR != 'true'
        run: cargo clippy --workspace --all-targets --features core-host/ai-inference -- -D warnings -D clippy::unwrap_used

      # Compile-only stand-in for the lint above on Renovate PRs: a dep bump
      # can surface new deprecation warnings in our code that `-D warnings`
      # would turn into failures, and the fast lane only gates on "does it
      # still compile".
      - name: Compile workspace (Renovate compile-only lane)
        if: env.RENOVATE_PR == 'true'
        run: cargo check --workspace --all-targets --features core-host/ai-inference

      - name: Cross-Layer Validation
        if: env.RENOVATE_PR != 'true'
        run: bash scripts/validate_cross_layer.sh

      - name: Check ai-inference host build
        run: cargo check -p core-host --features ai-inference

      - name: Verify constrained decoding is implemented, not just specified
        # openspec/specs/core-host/spec.md requires native constrained decoding
        # behind ai-inference. The previous attempt at this (archived change
        # 2026-05-16-ai-constrained-decoding) merged the spec text with 0 lines
        # of matching code. Guard against that drift recurring: the FSM/logit
        # masking engine must exist in core-host/src, and the WIT contract must
        # expose `sample-constrained`.
        run: |
          grep -rq "FsmLogitProcessor" core-host/src
          grep -q "sample-constrained" wit/ai/inference.wit

      - name: Test real Candle LLM fixture
        if: env.RENOVATE_PR != 'true'
        run: cargo test -p core-host --features ai-inference --bin core-host real_candle_llm_runtime

      # Build the guest the streaming integration test drives, then run it. The
      # test resolves `target/wasm32-wasip2/release/guest_openai.wasm`; with
      # TACHYON_REQUIRE_GUEST_OPENAI set it fails hard instead of skipping if the
      # artifact is missing, so this can never become a false green.
      - name: Build guest-openai (wasm) for the streaming integration test
        if: env.RENOVATE_PR != 'true'
        run: cargo build -p guest-openai --target wasm32-wasip2 --release

      - name: Test AI streaming SSE transport end-to-end
        if: env.RENOVATE_PR != 'true'
        env:
          TACHYON_REQUIRE_GUEST_OPENAI: "1"
        run: cargo test -p core-host --features ai-inference --bin core-host streaming_guest_openai -- --nocapture

  # ── 3b. CUDA quality gate (requires the self-hosted ARC GPU runner) ────────
  # This job owns the CUDA-enabled Candle build so the default ubuntu-latest
  # quality job can stay CPU-only while still validating GPU ONNX inference code.
  cuda-quality:
    runs-on: arc-gpu-runners
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
      # Renovate compile-only fast lane (see top of file): this runner is the
      # scarce resource, so dependency PRs only run the `cargo check` steps —
      # clippy and every GPU execution proof are skipped.
      RENOVATE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cuda-quality
          # Keep the expensive CUDA dependency build when a later GPU proof
          # fails or times out, so the next run can resume from the cache.
          cache-on-failure: true

      # The ARC GPU runner on Talos has the NVIDIA driver (nvidia-smi works) but
      # cudarc/candle-kernels need `nvcc` from the CUDA toolkit at build time.
      # The toolkit's bin dir is not always on PATH for the job's non-login
      # shell, so discover nvcc (PATH, then the usual roots, then a bounded
      # filesystem search) and export its bin dir + CUDA_PATH/CUDA_HOME. Print
      # diagnostics so a genuinely missing toolkit is easy to spot in the log.
      - name: Put CUDA toolkit on PATH
        run: |
          echo "PATH=$PATH"
          echo "CUDA_HOME=${CUDA_HOME:-<unset>} CUDA_PATH=${CUDA_PATH:-<unset>}"
          nvcc_bin=""
          # 1. Already on PATH?
          if command -v nvcc >/dev/null 2>&1; then
            nvcc_bin="$(command -v nvcc)"
          fi
          # 2. Well-known install roots.
          if [ -z "$nvcc_bin" ]; then
            for cuda in "${CUDA_HOME:-}" "${CUDA_PATH:-}" \
                        /usr/local/cuda /usr/local/cuda-* \
                        /opt/cuda /opt/cuda-* /usr/lib/cuda /usr/cuda; do
              if [ -n "$cuda" ] && [ -x "$cuda/bin/nvcc" ]; then
                nvcc_bin="$cuda/bin/nvcc"
                break
              fi
            done
          fi
          # 3. Last resort: bounded search of likely roots.
          if [ -z "$nvcc_bin" ]; then
            nvcc_bin="$(find /usr /opt -maxdepth 5 -name nvcc -type f -executable 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$nvcc_bin" ]; then
            echo "::error::nvcc not found on this runner. The CUDA *toolkit* (not just the driver) must be installed in the arc-gpu-runners image. nvidia-smi alone is not enough — candle-kernels/cudarc compile .cu kernels with nvcc at build time."
            echo "--- diagnostics ---"
            echo "ls /usr/local:"; ls -la /usr/local 2>/dev/null || true
            echo "ls /opt:";       ls -la /opt 2>/dev/null || true
            echo "dpkg cuda pkgs:"; dpkg -l 2>/dev/null | grep -i cuda || echo "  (none)"
            exit 1
          fi
          cuda_root="$(dirname "$(dirname "$nvcc_bin")")"
          echo "Found nvcc at $nvcc_bin (CUDA root: $cuda_root)"
          echo "$(dirname "$nvcc_bin")" >> "$GITHUB_PATH"
          echo "CUDA_PATH=$cuda_root" >> "$GITHUB_ENV"
          echo "CUDA_HOME=$cuda_root" >> "$GITHUB_ENV"

      - name: Verify CUDA toolchain
        run: |
          nvidia-smi
          nvcc --version

      # Build for whatever this runner actually is. The architecture is read
      # from the device rather than pinned, so the kernel is compiled for the
      # GPU that will run it.
      - name: Configure NVFP4 CUDA architecture
        if: env.RENOVATE_PR != 'true'
        run: |
          compute_capability="$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -n1 | tr -d '[:space:].')"
          if [ -z "$compute_capability" ]; then
            echo "::error::failed to determine GPU compute capability for NVFP4 CUDA build"
            exit 1
          fi
          arch="sm_${compute_capability}"
          echo "TACHYON_NVFP4_CUDA_ARCH=$arch" >> "$GITHUB_ENV"
          echo "Using NVFP4 CUDA architecture $arch"

      # candle-onnx's build script compiles the ONNX .proto and needs `protoc`.
      # The CPU jobs get it from `apt-get install protobuf-compiler`, but this
      # GPU runner image is RPM/UBI-based (no apt), so install protoc in a
      # distro-agnostic way. Skipped if the runner image already ships protoc.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Candle CUDA host build
        run: cargo check -p core-host --features candle-cuda

      # Renovate fast lane: also prove the FlashInfer kernel crate still
      # compiles against the updated deps. On regular runs this compile is
      # covered by the FlashInfer test steps below, which the fast lane skips.
      - name: Check Candle CUDA + FlashInfer host build (Renovate compile-only lane)
        if: env.RENOVATE_PR == 'true'
        run: cargo check -p core-host --features "candle-cuda candle-flashinfer"

      - name: Lint Candle CUDA host build
        if: env.RENOVATE_PR != 'true'
        run: cargo clippy -p core-host --features candle-cuda --all-targets -- -D warnings -D clippy::unwrap_used

      # Compile test binaries separately so execution-proof timeouts only
      # cover the GPU operation, not a cold Candle CUDA compilation.
      - name: Build Candle CUDA test binaries
        if: env.RENOVATE_PR != 'true'
        run: cargo test -p core-host --bin core-host --features candle-cuda --no-run

      # Proves the tensor-parallel all-reduce path issues a real NCCL
      # AllReduce on this runner's real GPU (via ncclCommInitAll loopback
      # ranks, see parallel.rs), not just that candle-cuda compiles/lints.
      - name: Run CUDA NCCL all-reduce proof
        if: env.RENOVATE_PR != 'true'
        timeout-minutes: 10
        run: cargo test -p core-host --bin core-host --features candle-cuda nccl_all_reduce_matches_cpu_staged_reference -- --nocapture

      # Proves the single-device Llama path (enable-single-device-llama-cuda-execution)
      # actually loads weights and runs a real autoregressive decode on this
      # runner's GPU instead of falling back to `Device::Cpu`.
      - name: Run single-device Llama CUDA execution proof
        if: env.RENOVATE_PR != 'true'
        timeout-minutes: 15
        run: cargo test -p core-host --bin core-host --features candle-cuda single_device_llama_executes_on_a_real_cuda_device -- --nocapture

      # Proves hardware_strategy.paged_attention (wire-paged-attention-decode-path)
      # actually attaches cache.set_paged_kv and runs a real decode through
      # flash_attn_varlen_paged_windowed on this runner's GPU, including a
      # second request reusing the same shared block pool.
      - name: Run paged-attention CUDA execution proof
        if: env.RENOVATE_PR != 'true'
        timeout-minutes: 15
        run: cargo test -p core-host --bin core-host --features candle-cuda single_device_llama_paged_attention_generates_a_real_decode_on_cuda -- --nocapture

      # Proves cuda_graph_decode fails closed without paged_attention and for
      # GGUF, which has no paged GPU cache (wire-cuda-graph-decode's Section 2.1 gate).
      - name: Run CUDA Graph decode gate proof
        if: env.RENOVATE_PR != 'true'
        timeout-minutes: 10
        run: cargo test -p core-host --bin core-host --features candle-cuda cuda_graph_decode_strategy_is_rejected -- --nocapture

      # Proves hardware_strategy.cuda_graph_decode (wire-cuda-graph-decode)
      # actually captures and replays the steady-state decode step through
      # candle_core::CudaGraph on this runner's GPU (CudaGraphDecodeSession:
      # warm-up, capture, first replay, then plain replays), and that its
      # output matches the non-captured paged-attention path's greedy decode
      # for the same checkpoint/prompt — not just that it runs without error.
      - name: Run CUDA Graph decode capture/replay execution proof
        if: env.RENOVATE_PR != 'true'
        timeout-minutes: 20
        run: cargo test -p core-host --bin core-host --features candle-cuda single_device_llama_cuda_graph_decode_generates_a_real_captured_decode_on_cuda -- --nocapture

      # FlashInfer adds its own CUDA crate, so prepare those test binaries
      # before applying the execution-proof timeout below.
      - name: Build FlashInfer CUDA test binaries
        if: env.RENOVATE_PR != 'true'
        timeout-minutes: 30
        run: cargo test -p core-host --bin core-host --features "candle-cuda candle-flashinfer" --no-run

      # Proves hardware_strategy.flashinfer_attention (wire-flashinfer-decode-attention)
      # actually dispatches through candle-flashinfer-kernels::flashinfer_decode_attention
      # for the decode step on this runner's GPU, and that its output matches the
      # dense (non-flashinfer) path's greedy decode for the same checkpoint/prompt.
      - name: Run FlashInfer decode-attention CUDA execution proof
        if: env.RENOVATE_PR != 'true'
        timeout-minutes: 15
        run: cargo test -p core-host --bin core-host --features "candle-cuda candle-flashinfer" single_device_llama_flashinfer_attention_generates_a_real_decode_on_cuda -- --nocapture

      - name: Run FlashInfer/paged-attention combination rejection proof
        if: env.RENOVATE_PR != 'true'
        timeout-minutes: 10
        run: cargo test -p core-host --bin core-host --features "candle-cuda candle-flashinfer" flashinfer_attention_and_paged_attention_combination_is_rejected -- --nocapture

      # The CUTLASS headers used to be cloned here because this repository
      # compiled its own NVFP4 kernel. `candle-nvfp4-kernels` owns that now and
      # brings its own build, so the checkout and the include-dir hand-off are
      # both gone.
      # Synthetic tensors, no checkpoint: this asks only whether the native
      # kernel agrees with the scalar fallback on the runner's own device.
      # candle #3831 removed the compute-capability floor that used to keep it
      # opt-in, and candle's own suite owns the hardware question now, so it
      # runs on every PR against whatever GPU the pool hands us.
      - name: Run native NVFP4 parity and telemetry proof
        if: env.RENOVATE_PR != 'true'
        env:
          TACHYON_NVFP4_CUDA_SMOKE: "1"
        run: cargo test -p core-host --features "candle-cuda nvfp4-cuda" nvfp4_cuda -- --nocapture

  # ── 4. Tests (needs quality + guests) ───────────────────────────────────────
  # Runs the full workspace nextest suite — including the core-host chaos
  # integration test — plus doc tests.
  # Separate job means it gets its own 14 GB disk, avoiding the exhaustion
  # that plagued the previous monolithic rust-ci job.
  test:
    # Skipped on Renovate PRs — compile-only fast lane (see top of file).
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      # mold links our many statically-linked host test/bin targets far faster
      # than GNU ld; symlinking it over /usr/bin/ld makes cargo's default cc
      # driver use it without touching RUSTFLAGS or the wasm32/musl
      # cross-linkers (which use rust-lld).
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      # tachyon-ui is a Tauri desktop app with no unit tests (covered by
      # Playwright E2E in e2e.yml). Excluding it avoids pulling in GTK/WebKit
      # system libraries that are only needed in the quality job.
      - name: Run tests
        run: cargo nextest run --workspace --exclude tachyon-ui

      - name: Run doc tests
        run: cargo test --doc --workspace --exclude tachyon-ui

  # ── 5. Coverage (needs quality + guests, runs in parallel with test) ─────────
  # Separate job gives a fresh disk so the large llvm-cov instrumented tree
  # doesn't compete with the test or release build for SSD space.
  cover:
    # Skipped on Renovate PRs — compile-only fast lane (see top of file).
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Generate core-host coverage
        run: cargo llvm-cov -p core-host --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: core-host-lcov-${{ github.sha }}
          if-no-files-found: error
          path: lcov.info

  # ── 6. Release build (needs quality + guests, parallel with test + cover) ────
  # Only builds core-host --release. tachyon-ui is excluded: clippy already
  # validates it compiles, and Publish Tachyon Desktop handles the Tauri bundle.
  release:
    # Skipped on Renovate PRs — compile-only fast lane (see top of file).
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
      # This binary is a CI validation artifact, not a published release —
      # thin LTO trades a little runtime perf for much faster builds.
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: Swatinem/rust-cache@v2

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Build core-host in release mode
        run: cargo build -p core-host --release

      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tachyon-mesh-build-${{ github.sha }}
          if-no-files-found: error
          path: |
            integrity.lock
            target/release/core-host
            target/wasm32-wasip1/release/guest_ai.wasm
            target/wasm32-wasip2/release/guest_example.wasm
            target/wasm32-wasip2/release/guest_flaky.wasm
            target/wasm32-wasip2/release/guest_grpc.wasm
            target/wasm32-wasip1/release/guest_log_storm.wasm
            target/wasm32-wasip1/release/guest_tcp_echo.wasm
            target/wasm32-wasip2/release/guest_udp_echo.wasm
            target/wasm32-wasip2/release/guest_voip_gate.wasm
            target/wasm32-wasip2/release/guest_volume.wasm
            target/wasm32-wasip2/release/system_faas_bridge.wasm
            target/wasm32-wasip2/release/system_faas_authn.wasm
            target/wasm32-wasip2/release/system_faas_authz.wasm
            target/wasm32-wasip2/release/system_faas_cert_manager.wasm
            target/wasm32-wasip2/release/system_faas_cdc.wasm
            target/wasm32-wasip2/release/buffer.wasm
            target/wasm32-wasip2/release/system_faas_gc.wasm
            target/wasm32-wasip2/release/system_faas_gateway.wasm
            target/wasm32-wasip2/release/gossip.wasm
            target/wasm32-wasip1/release/guest_loop.wasm
            target/wasm32-wasip2/release/k8s_scaler.wasm
            target/wasm32-wasip2/release/system_faas_logger.wasm
            target/wasm32-wasip2/release/system_faas_model_broker.wasm
            target/wasm32-wasip2/release/metering.wasm
            target/wasm32-wasip2/release/metrics.wasm
            target/wasm32-wasip2/release/system_faas_registry.wasm
            target/wasm32-wasip2/release/scaling.wasm
            target/wasm32-wasip2/release/system_faas_s3_proxy.wasm
            target/wasm32-wasip2/release/system_faas_shadow_proxy.wasm
            target/wasm32-wasip2/release/system_faas_sqs.wasm
            target/wasm32-wasip2/release/system_faas_storage_broker.wasm

  # ── 7. Feature matrix (5 parallel variants, shared Rust cache) ──────────────
  # Waits for quality so clippy failures don't spawn 5 redundant matrix runs.
  feature-matrix-tests:
    # Skipped on Renovate PRs — compile-only fast lane (see top of file);
    # feature-gated compile coverage comes from quality's per-feature loop.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          # Since #310, `admin-plane` joined `default` — this bare
          # `--no-default-features` entry now also builds/tests with no
          # `/admin/*` surface (previously it only dropped `ring`). The
          # dedicated worker-profile entry below is the realistic worker
          # build (transport stack included); this one is the maximally
          # minimal floor.
          - "--no-default-features"
          # "All CPU features": every feature except core-host/candle-cuda, which
          # pulls in cudarc and requires `nvcc` (validated separately by the
          # cuda-quality job on the GPU runner). A bare `--all-features` would
          # break on these CPU-only runners. Mirrors publish-docker-images'
          # "-all-features" variant.
          - "--features ai-inference,ebpf-loader,experimental,fips,http3,mtls,nvfp4-cuda,rate-limit,resiliency,ring,s3-persistence,secrets-vault,websockets"
          - "--features http3"
          - "--features rate-limit,resiliency,mtls,secrets-vault,websockets"
          # Worker data-plane profile (#310): `admin-plane` is in `default`, so
          # dropping it requires `--no-default-features` plus the transport
          # stack a real mesh member needs back (TLS, mTLS gateway, websocket
          # mesh dispatch, rate limiting/resiliency). Asserts no `/admin/*`
          # surface except enrollment bootstrap — see
          # `worker_profile_completes_enrollment_bootstrap_with_no_admin_surface`
          # in `core-host/src/host_core/tests/http_router.rs`.
          - "--no-default-features --features ring,rate-limit,resiliency,mtls,secrets-vault,websockets"
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-matrix
          save-if: ${{ matrix.features == '' }}

      - name: Install FIPS build dependencies
        if: contains(matrix.features, 'fips')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Test core-host feature set
        run: cargo nextest run -p core-host ${{ matrix.features }}

  # ── 7b. Feature matrix release artifacts (decoupled from tests) ─────────────
  # Builds and uploads a per-variant release binary for manual download/
  # debugging. Not consumed by any downstream job, so it is intentionally NOT
  # a dependency of publish-docker-images (which builds its own images from
  # source). Runs in parallel with feature-matrix-tests rather than after it.
  feature-matrix-artifacts:
    # Skipped on Renovate PRs — compile-only fast lane (see top of file).
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "--no-default-features"
          # "All CPU features": every feature except core-host/candle-cuda, which
          # pulls in cudarc and requires `nvcc` (validated separately by the
          # cuda-quality job on the GPU runner). A bare `--all-features` would
          # break on these CPU-only runners. Mirrors publish-docker-images'
          # "-all-features" variant.
          - "--features ai-inference,ebpf-loader,experimental,fips,http3,mtls,nvfp4-cuda,rate-limit,resiliency,ring,s3-persistence,secrets-vault,websockets"
          - "--features http3"
          - "--features rate-limit,resiliency,mtls,secrets-vault,websockets"
          # Worker data-plane profile (#310) — see the matching comment on
          # `feature-matrix-tests` above.
          - "--no-default-features --features ring,rate-limit,resiliency,mtls,secrets-vault,websockets"
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D dead_code"
      # This binary is a CI validation artifact, not a published release —
      # thin LTO trades a little runtime perf for much faster builds.
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-matrix
          save-if: ${{ matrix.features == '' }}

      - name: Install FIPS build dependencies
        if: contains(matrix.features, 'fips')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Build release binary for artifact
        run: cargo build -p core-host --release ${{ matrix.features }}

      - name: Derive artifact label from features
        id: feat_label
        shell: bash
        run: |
          case "${{ matrix.features }}" in
            "")                                                        label="default" ;;
            "--no-default-features")                                   label="no-default" ;;
            "--features ai-inference,"*)                               label="all" ;;
            "--features http3")                                        label="http3" ;;
            "--features rate-limit,resiliency,mtls,secrets-vault,websockets") label="security" ;;
            "--no-default-features --features ring,"*)                 label="worker" ;;
            *)                                                         label="custom" ;;
          esac
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Upload core-host binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-host-linux-x86_64-${{ steps.feat_label.outputs.label }}-${{ github.sha }}
          path: target/release/core-host
          if-no-files-found: error

  # ── 8. FIPS tests ────────────────────────────────────────────────────────────
  fips-tests:
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # Renovate compile-only fast lane (see top of file): drop to a compile
      # check. This job (not quality) hosts the FIPS check because its Rust
      # cache already holds the aws-lc FIPS build artifacts.
      RENOVATE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install FIPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        if: env.RENOVATE_PR != 'true'
        uses: taiki-e/install-action@nextest

      - name: Download guest artifacts
        if: env.RENOVATE_PR != 'true'
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        if: env.RENOVATE_PR != 'true'
        run: tar -xzf wasm-guests.tar.gz

      - name: Test core-host FIPS feature
        if: env.RENOVATE_PR != 'true'
        run: cargo nextest run -p core-host --features fips

      - name: Check core-host FIPS feature (Renovate compile-only lane)
        if: env.RENOVATE_PR == 'true'
        run: cargo check -p core-host --features fips

  # ── 8b. FIPS release artifact (decoupled from tests) ────────────────────────
  # Not consumed by any downstream job, so it is intentionally NOT a
  # dependency of publish-docker-images (which builds its own FIPS image
  # from source via Dockerfile.fips).
  fips-artifacts:
    # Skipped on Renovate PRs — compile-only fast lane (see top of file).
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # This binary is a CI validation artifact, not a published release —
      # thin LTO trades a little runtime perf for much faster builds.
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install FIPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - uses: Swatinem/rust-cache@v2

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Build FIPS release binary for artifact
        run: cargo build -p core-host --release --features fips

      - name: Upload FIPS core-host binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-host-linux-x86_64-fips-${{ github.sha }}
          path: target/release/core-host
          if-no-files-found: error

  # ── 9. Publish Docker images (push to main, needs quality + test) ─────────
  # Docker builds core-host from source inside the Dockerfile, so it doesn't
  # consume the pre-built release artifact. It waits on the *test* jobs only
  # (not the artifact-build jobs above, which are unused by this job and were
  # previously on its critical path) so we don't publish an image that fails
  # basic validation, while starting as early as possible. It also depends on
  # docker-base purely for sequencing (so the matrix below sees a warm GHA
  # cache); docker-base is best-effort (continue-on-error), so this never
  # blocks on it.
  publish-docker-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-base, quality, manifest-schema-compatibility, test, cover, release, feature-matrix-tests, fips-tests]
    runs-on: ubuntu-latest
    env:
      BUILDKIT_PROGRESS: plain
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 4 ./Dockerfile variants share a "docker-default" GHA cache
          # scope: the FaaS/system wasm + legacy-mock layers (everything
          # before the CARGO_FEATURES ARG) are feature-independent, so a
          # cache populated by one variant (or by the E2E workflows, which
          # build the same Dockerfile) is reused by the others.
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "s3-persistence"
            feature_tag: ""
            cache_scope: docker-default
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile.fips
            context: .
            cargo_features: ""
            feature_tag: "-fips"
            cache_scope: docker-fips
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "http3"
            feature_tag: "-http3"
            cache_scope: docker-default
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "rate-limit,resiliency,mtls,secrets-vault,websockets"
            feature_tag: "-security"
            cache_scope: docker-default
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "ai-inference,ebpf-loader,experimental,http3,mtls,rate-limit,resiliency,s3-persistence,secrets-vault,websockets"
            feature_tag: "-all-features"
            cache_scope: docker-default
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.feature_tag }}
            type=sha,prefix=sha-,suffix=${{ matrix.feature_tag }}
            type=raw,value=latest${{ matrix.feature_tag }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # GHCR intermittently returns "error writing layer blob: not_found" when
      # the matrix variants push their shared base-layer blobs to the same repo
      # concurrently (blob cross-mount race). The build itself is cached, so the
      # first attempt is left as continue-on-error and a single retry rides out
      # the transient push failure (re-pushing from the warm buildkit/gha cache).
      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_FEATURES=${{ matrix.cargo_features }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Build and publish Docker image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_FEATURES=${{ matrix.cargo_features }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
