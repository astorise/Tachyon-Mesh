name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR/feature branches, but never on main:
  # publish-docker-images pushes mutable latest* tags, and cancelling a run
  # mid-publish could leave GHCR with latest* tags from mixed commits. The
  # group still serializes main runs, so a new push waits instead of killing
  # an in-flight publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ── Shared env snippets used across multiple jobs ─────────────────────────────
# RUSTFLAGS and CARGO_TERM_COLOR are repeated per-job so each job's env block
# is self-contained and readable without cross-referencing.

jobs:
  # ── 1. Build WASM guest artifacts once ──────────────────────────────────────
  # Packs with tar to preserve target/wasm32-wasip*/release/ paths exactly.
  # All downstream jobs unpack instead of rebuilding (~12-15 min each).
  build-guests:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-guests

      - name: Build guest artifacts
        run: bash scripts/build-guest-artifacts.sh

      - name: Pack guest artifacts
        run: tar -czf wasm-guests.tar.gz target/wasm32-wasip1/release/*.wasm target/wasm32-wasip2/release/*.wasm

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-guests-${{ github.sha }}
          path: wasm-guests.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Pack example guest modules
        run: |
          tar --transform 's|.*/||' -czf guest-examples.tar.gz \
            target/wasm32-wasip1/release/guest_*.wasm \
            target/wasm32-wasip2/release/guest_*.wasm \
            examples/guest-examples/manifest.json

      - name: Upload example guest modules archive
        uses: actions/upload-artifact@v7
        with:
          name: guest-examples-${{ github.sha }}
          path: guest-examples.tar.gz
          if-no-files-found: error
          retention-days: 90

  # ── 1b. Docker layer cache warm-up (runs in parallel with build-guests) ─────
  # Pre-builds the shared builder stages of Dockerfile / Dockerfile.fips /
  # Dockerfile.e2e (apt+rustup setup, cargo-chef `planner`/cook layers — see
  # the `chef`/`planner`/`*-builder` stages) and exports them with
  # `cache-to: type=gha,mode=max`. This warms the docker-default, docker-fips
  # and docker-e2e-slim scopes BEFORE publish-docker-images' 5-way matrix and
  # the e2e-mesh/e2e-k8s/integration/e2e-zero-touch workflows read from them
  # (all triggered by this same push to main), so the shared ~16-package
  # dependency compile happens once instead of cold-starting in parallel
  # everywhere.
  # `outputs: type=cacheonly` skips producing a loadable image — only the
  # layer cache is exported. `continue-on-error: true` makes this strictly
  # best-effort: a warm-up failure just leaves a scope cold (today's
  # behavior), it never blocks publish-docker-images.
  docker-base:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ./Dockerfile splits its builder into a feature-independent
          # wasm-builder (shared by every variant) and a feature-dependent
          # host-builder; warming host-builder with empty features still
          # populates its pre-ARG default core-host / FaaS dependency cooks,
          # which all variants share. Both feed the same docker-default scope.
          - dockerfile: ./Dockerfile
            target: wasm-builder
            cache_scope: docker-default
          - dockerfile: ./Dockerfile
            target: host-builder
            cache_scope: docker-default
          - dockerfile: ./Dockerfile.e2e
            target: rust-builder
            cache_scope: docker-e2e-slim
          - dockerfile: ./Dockerfile.fips
            target: wasm-builder
            cache_scope: docker-fips
          - dockerfile: ./Dockerfile.fips
            target: fips-builder
            cache_scope: docker-fips
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warm ${{ matrix.cache_scope }} cache (${{ matrix.dockerfile }} → ${{ matrix.target }})
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  # ── 2. Security audit (runs in parallel with build-guests) ──────────────────
  security-audit:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Run cargo audit
        # RUSTSEC-2023-0071 (rsa Marvin attack) targets RSA private-key
        # decryption timing; we only verify JWT signatures with public keys
        # (no private-key ops), so it does not apply. See deny.toml for detail.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Run cargo deny
        run: cargo deny check advisories bans sources

  # ── 3. Quality gate (runs in parallel with build-guests + security-audit) ───
  # Fast checks that gate everything downstream: fmt, clippy, cross-layer
  # validation and per-feature compilation checks.
  # cargo build -p tachyon-ui --release is intentionally absent: clippy
  # --workspace already verifies the crate compiles, and the Publish Tachyon
  # Desktop workflow handles the full Tauri bundle on main and version tags.
  quality:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            cmake \
            nasm \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler \
            mold
          # Make mold the default host linker (drop-in for /usr/bin/ld) so every
          # cargo link in this job is faster; wasm32 cross-links use rust-lld and
          # are unaffected, and RUSTFLAGS is untouched.
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace (CPU features)
        # Keep the general quality gate on ubuntu-latest CPU runners: CUDA is
        # validated separately by the arc-gpu-runners job below. `--all-features`
        # would enable core-host/candle-cuda and require nvcc on this runner.
        run: cargo clippy --workspace --all-targets --features core-host/ai-inference -- -D warnings -D clippy::unwrap_used

      - name: Cross-Layer Validation
        run: bash scripts/validate_cross_layer.sh

      - name: Check ai-inference host build
        run: cargo check -p core-host --features ai-inference

      - name: Test real Candle LLM fixture
        run: cargo test -p core-host --features ai-inference --bin core-host real_candle_llm_runtime

      # Build the guest the streaming integration test drives, then run it. The
      # test resolves `target/wasm32-wasip2/release/guest_openai.wasm`; with
      # TACHYON_REQUIRE_GUEST_OPENAI set it fails hard instead of skipping if the
      # artifact is missing, so this can never become a false green.
      - name: Build guest-openai (wasm) for the streaming integration test
        run: cargo build -p guest-openai --target wasm32-wasip2 --release

      - name: Test AI streaming SSE transport end-to-end
        env:
          TACHYON_REQUIRE_GUEST_OPENAI: "1"
        run: cargo test -p core-host --features ai-inference --bin core-host streaming_guest_openai -- --nocapture

      - name: Check s3-persistence host build
        run: cargo check -p core-host --features s3-persistence

  # ── 3b. CUDA quality gate (requires the self-hosted ARC GPU runner) ────────
  # This job owns the CUDA-enabled Candle build so the default ubuntu-latest
  # quality job can stay CPU-only while still validating GPU ONNX inference code.
  cuda-quality:
    runs-on: arc-gpu-runners
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cuda-quality

      # The ARC GPU runner on Talos has the NVIDIA driver (nvidia-smi works) but
      # cudarc/candle-kernels need `nvcc` from the CUDA toolkit at build time.
      # The toolkit's bin dir is not always on PATH for the job's non-login
      # shell, so discover nvcc (PATH, then the usual roots, then a bounded
      # filesystem search) and export its bin dir + CUDA_PATH/CUDA_HOME. Print
      # diagnostics so a genuinely missing toolkit is easy to spot in the log.
      - name: Put CUDA toolkit on PATH
        run: |
          echo "PATH=$PATH"
          echo "CUDA_HOME=${CUDA_HOME:-<unset>} CUDA_PATH=${CUDA_PATH:-<unset>}"
          nvcc_bin=""
          # 1. Already on PATH?
          if command -v nvcc >/dev/null 2>&1; then
            nvcc_bin="$(command -v nvcc)"
          fi
          # 2. Well-known install roots.
          if [ -z "$nvcc_bin" ]; then
            for cuda in "${CUDA_HOME:-}" "${CUDA_PATH:-}" \
                        /usr/local/cuda /usr/local/cuda-* \
                        /opt/cuda /opt/cuda-* /usr/lib/cuda /usr/cuda; do
              if [ -n "$cuda" ] && [ -x "$cuda/bin/nvcc" ]; then
                nvcc_bin="$cuda/bin/nvcc"
                break
              fi
            done
          fi
          # 3. Last resort: bounded search of likely roots.
          if [ -z "$nvcc_bin" ]; then
            nvcc_bin="$(find /usr /opt -maxdepth 5 -name nvcc -type f -executable 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$nvcc_bin" ]; then
            echo "::error::nvcc not found on this runner. The CUDA *toolkit* (not just the driver) must be installed in the arc-gpu-runners image. nvidia-smi alone is not enough — candle-kernels/cudarc compile .cu kernels with nvcc at build time."
            echo "--- diagnostics ---"
            echo "ls /usr/local:"; ls -la /usr/local 2>/dev/null || true
            echo "ls /opt:";       ls -la /opt 2>/dev/null || true
            echo "dpkg cuda pkgs:"; dpkg -l 2>/dev/null | grep -i cuda || echo "  (none)"
            exit 1
          fi
          cuda_root="$(dirname "$(dirname "$nvcc_bin")")"
          echo "Found nvcc at $nvcc_bin (CUDA root: $cuda_root)"
          echo "$(dirname "$nvcc_bin")" >> "$GITHUB_PATH"
          echo "CUDA_PATH=$cuda_root" >> "$GITHUB_ENV"
          echo "CUDA_HOME=$cuda_root" >> "$GITHUB_ENV"

      - name: Verify CUDA toolchain
        run: |
          nvidia-smi
          nvcc --version

      - name: Check Candle CUDA host build
        run: cargo check -p core-host --features candle-cuda

      - name: Lint Candle CUDA host build
        run: cargo clippy -p core-host --features candle-cuda --all-targets -- -D warnings -D clippy::unwrap_used

  # ── 4. Tests (needs quality + guests) ───────────────────────────────────────
  # Runs the full workspace nextest suite — including the core-host chaos
  # integration test — plus doc tests.
  # Separate job means it gets its own 14 GB disk, avoiding the exhaustion
  # that plagued the previous monolithic rust-ci job.
  test:
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      # mold links our many statically-linked host test/bin targets far faster
      # than GNU ld; symlinking it over /usr/bin/ld makes cargo's default cc
      # driver use it without touching RUSTFLAGS or the wasm32/musl
      # cross-linkers (which use rust-lld).
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      # tachyon-ui is a Tauri desktop app with no unit tests (covered by
      # Playwright E2E in e2e.yml). Excluding it avoids pulling in GTK/WebKit
      # system libraries that are only needed in the quality job.
      - name: Run tests
        run: cargo nextest run --workspace --exclude tachyon-ui

      - name: Run doc tests
        run: cargo test --doc --workspace --exclude tachyon-ui

  # ── 5. Coverage (needs quality + guests, runs in parallel with test) ─────────
  # Separate job gives a fresh disk so the large llvm-cov instrumented tree
  # doesn't compete with the test or release build for SSD space.
  cover:
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Generate core-host coverage
        run: cargo llvm-cov -p core-host --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: core-host-lcov-${{ github.sha }}
          if-no-files-found: error
          path: lcov.info

  # ── 6. Release build (needs quality + guests, parallel with test + cover) ────
  # Only builds core-host --release. tachyon-ui is excluded: clippy already
  # validates it compiles, and Publish Tachyon Desktop handles the Tauri bundle.
  release:
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
      # This binary is a CI validation artifact, not a published release —
      # thin LTO trades a little runtime perf for much faster builds.
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: Swatinem/rust-cache@v2

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Build core-host in release mode
        run: cargo build -p core-host --release

      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tachyon-mesh-build-${{ github.sha }}
          if-no-files-found: error
          path: |
            integrity.lock
            target/release/core-host
            target/wasm32-wasip1/release/guest_ai.wasm
            target/wasm32-wasip2/release/guest_example.wasm
            target/wasm32-wasip2/release/guest_flaky.wasm
            target/wasm32-wasip2/release/guest_grpc.wasm
            target/wasm32-wasip1/release/guest_log_storm.wasm
            target/wasm32-wasip1/release/guest_tcp_echo.wasm
            target/wasm32-wasip2/release/guest_udp_echo.wasm
            target/wasm32-wasip2/release/guest_voip_gate.wasm
            target/wasm32-wasip2/release/guest_volume.wasm
            target/wasm32-wasip2/release/system_faas_bridge.wasm
            target/wasm32-wasip2/release/system_faas_authn.wasm
            target/wasm32-wasip2/release/system_faas_authz.wasm
            target/wasm32-wasip2/release/system_faas_cert_manager.wasm
            target/wasm32-wasip2/release/system_faas_cdc.wasm
            target/wasm32-wasip2/release/buffer.wasm
            target/wasm32-wasip2/release/system_faas_gc.wasm
            target/wasm32-wasip2/release/system_faas_gateway.wasm
            target/wasm32-wasip2/release/gossip.wasm
            target/wasm32-wasip1/release/guest_loop.wasm
            target/wasm32-wasip2/release/k8s_scaler.wasm
            target/wasm32-wasip2/release/system_faas_logger.wasm
            target/wasm32-wasip2/release/system_faas_model_broker.wasm
            target/wasm32-wasip2/release/metering.wasm
            target/wasm32-wasip2/release/metrics.wasm
            target/wasm32-wasip2/release/system_faas_registry.wasm
            target/wasm32-wasip2/release/scaling.wasm
            target/wasm32-wasip2/release/system_faas_s3_proxy.wasm
            target/wasm32-wasip2/release/system_faas_shadow_proxy.wasm
            target/wasm32-wasip2/release/system_faas_sqs.wasm
            target/wasm32-wasip2/release/system_faas_storage_broker.wasm

  # ── 7. Feature matrix (5 parallel variants, shared Rust cache) ──────────────
  # Waits for quality so clippy failures don't spawn 5 redundant matrix runs.
  feature-matrix-tests:
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "--no-default-features"
          # "All CPU features": every feature except core-host/candle-cuda, which
          # pulls in cudarc and requires `nvcc` (validated separately by the
          # cuda-quality job on the GPU runner). A bare `--all-features` would
          # break on these CPU-only runners. Mirrors publish-docker-images'
          # "-all-features" variant.
          - "--features ai-inference,ebpf-loader,experimental,fips,http3,mtls,nvfp4-cuda,rate-limit,resiliency,ring,s3-persistence,secrets-vault,websockets"
          - "--features http3"
          - "--features rate-limit,resiliency,mtls,secrets-vault,websockets"
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          sudo ln -sf "$(command -v mold)" /usr/bin/ld

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-matrix
          save-if: ${{ matrix.features == '' }}

      - name: Install FIPS build dependencies
        if: contains(matrix.features, 'fips')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Test core-host feature set
        run: cargo nextest run -p core-host ${{ matrix.features }}

  # ── 7b. Feature matrix release artifacts (decoupled from tests) ─────────────
  # Builds and uploads a per-variant release binary for manual download/
  # debugging. Not consumed by any downstream job, so it is intentionally NOT
  # a dependency of publish-docker-images (which builds its own images from
  # source). Runs in parallel with feature-matrix-tests rather than after it.
  feature-matrix-artifacts:
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "--no-default-features"
          # "All CPU features": every feature except core-host/candle-cuda, which
          # pulls in cudarc and requires `nvcc` (validated separately by the
          # cuda-quality job on the GPU runner). A bare `--all-features` would
          # break on these CPU-only runners. Mirrors publish-docker-images'
          # "-all-features" variant.
          - "--features ai-inference,ebpf-loader,experimental,fips,http3,mtls,nvfp4-cuda,rate-limit,resiliency,ring,s3-persistence,secrets-vault,websockets"
          - "--features http3"
          - "--features rate-limit,resiliency,mtls,secrets-vault,websockets"
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D dead_code"
      # This binary is a CI validation artifact, not a published release —
      # thin LTO trades a little runtime perf for much faster builds.
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-matrix
          save-if: ${{ matrix.features == '' }}

      - name: Install FIPS build dependencies
        if: contains(matrix.features, 'fips')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Build release binary for artifact
        run: cargo build -p core-host --release ${{ matrix.features }}

      - name: Derive artifact label from features
        id: feat_label
        shell: bash
        run: |
          case "${{ matrix.features }}" in
            "")                                                        label="default" ;;
            "--no-default-features")                                   label="no-default" ;;
            "--features ai-inference,"*)                               label="all" ;;
            "--features http3")                                        label="http3" ;;
            "--features rate-limit,resiliency,mtls,secrets-vault,websockets") label="security" ;;
            *)                                                         label="custom" ;;
          esac
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Upload core-host binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-host-linux-x86_64-${{ steps.feat_label.outputs.label }}-${{ github.sha }}
          path: target/release/core-host
          if-no-files-found: error

  # ── 8. FIPS tests ────────────────────────────────────────────────────────────
  fips-tests:
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install FIPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Test core-host FIPS feature
        run: cargo nextest run -p core-host --features fips

  # ── 8b. FIPS release artifact (decoupled from tests) ────────────────────────
  # Not consumed by any downstream job, so it is intentionally NOT a
  # dependency of publish-docker-images (which builds its own FIPS image
  # from source via Dockerfile.fips).
  fips-artifacts:
    needs: [quality, build-guests]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # This binary is a CI validation artifact, not a published release —
      # thin LTO trades a little runtime perf for much faster builds.
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install FIPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - uses: Swatinem/rust-cache@v2

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Build FIPS release binary for artifact
        run: cargo build -p core-host --release --features fips

      - name: Upload FIPS core-host binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-host-linux-x86_64-fips-${{ github.sha }}
          path: target/release/core-host
          if-no-files-found: error

  # ── 9. Publish Docker images (push to main, needs quality + test) ─────────
  # Docker builds core-host from source inside the Dockerfile, so it doesn't
  # consume the pre-built release artifact. It waits on the *test* jobs only
  # (not the artifact-build jobs above, which are unused by this job and were
  # previously on its critical path) so we don't publish an image that fails
  # basic validation, while starting as early as possible. It also depends on
  # docker-base purely for sequencing (so the matrix below sees a warm GHA
  # cache); docker-base is best-effort (continue-on-error), so this never
  # blocks on it.
  publish-docker-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-base, quality, test, cover, release, feature-matrix-tests, fips-tests]
    runs-on: ubuntu-latest
    env:
      BUILDKIT_PROGRESS: plain
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 4 ./Dockerfile variants share a "docker-default" GHA cache
          # scope: the FaaS/system wasm + legacy-mock layers (everything
          # before the CARGO_FEATURES ARG) are feature-independent, so a
          # cache populated by one variant (or by the E2E workflows, which
          # build the same Dockerfile) is reused by the others.
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "s3-persistence"
            feature_tag: ""
            cache_scope: docker-default
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile.fips
            context: .
            cargo_features: ""
            feature_tag: "-fips"
            cache_scope: docker-fips
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "http3"
            feature_tag: "-http3"
            cache_scope: docker-default
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "rate-limit,resiliency,mtls,secrets-vault,websockets"
            feature_tag: "-security"
            cache_scope: docker-default
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "ai-inference,ebpf-loader,experimental,http3,mtls,rate-limit,resiliency,s3-persistence,secrets-vault,websockets"
            feature_tag: "-all-features"
            cache_scope: docker-default
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.feature_tag }}
            type=sha,prefix=sha-,suffix=${{ matrix.feature_tag }}
            type=raw,value=latest${{ matrix.feature_tag }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # GHCR intermittently returns "error writing layer blob: not_found" when
      # the matrix variants push their shared base-layer blobs to the same repo
      # concurrently (blob cross-mount race). The build itself is cached, so the
      # first attempt is left as continue-on-error and a single retry rides out
      # the transient push failure (re-pushing from the warm buildkit/gha cache).
      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_FEATURES=${{ matrix.cargo_features }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Build and publish Docker image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_FEATURES=${{ matrix.cargo_features }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
