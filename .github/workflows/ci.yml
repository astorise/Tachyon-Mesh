name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  # ── Build every WASM guest once; all downstream jobs download the result. ────
  # This replaces the per-job `bash scripts/build-guest-artifacts.sh` call that
  # was costing ~10-15 min of compile time in rust-ci AND in each of the five
  # feature-matrix-tests variants (plus fips-tests), totalling ~80-100 min of
  # redundant CPU. The artifact is kept for one day — just long enough to cover
  # the CI run lifetime.
  build-guests:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-guests

      - name: Build guest artifacts
        run: bash scripts/build-guest-artifacts.sh

      # Pack with tar so the full relative path (target/wasm32-wasip*/release/)
      # is embedded in the archive. upload-artifact glob paths strip the common
      # prefix, which breaks the tests that resolve WASM modules by relative path.
      - name: Pack guest artifacts
        run: tar -czf wasm-guests.tar.gz target/wasm32-wasip1/release/*.wasm target/wasm32-wasip2/release/*.wasm

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-guests-${{ github.sha }}
          path: wasm-guests.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ── Security audit — runs in parallel with build-guests. ─────────────────────
  # cargo-audit and cargo-deny are compiled once and cached; subsequent runs
  # restore the binaries in ~2 s instead of recompiling them (~4-5 min).
  security-audit:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache security tools
        id: cache-sec-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: sec-tools-${{ runner.os }}-v1

      - name: Install security tooling
        if: steps.cache-sec-tools.outputs.cache-hit != 'true'
        run: cargo install cargo-audit cargo-deny --locked

      - name: Run cargo audit
        # RUSTSEC-2026-0149: wasmtime-wasi 44.0.1 path_open TRUNCATE bypass;
        # fixed in 44.0.2 — ignored until Cargo.lock is bumped via the Renovate
        # wasmtime v45 PR. cargo deny reads deny.toml; cargo audit needs the flag.
        run: cargo audit --ignore RUSTSEC-2026-0149

      - name: Run cargo deny
        run: cargo deny check advisories bans sources

  # ── Main CI: fmt, clippy, tests, coverage, release builds. ───────────────────
  rust-ci:
    needs: build-guests
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            cmake \
            nasm \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      # cargo-llvm-cov is compiled once and cached; restores in ~2 s.
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-v1

      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked

      # nextest is a pre-built binary (~5 s curl) — no need to cache separately.
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      # Restore WASM files into their original target/ paths.
      - name: Download guest artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::unwrap_used

      - name: Cross-Layer Validation
        run: bash scripts/validate_cross_layer.sh

      - name: Run chaos test harness
        run: cargo nextest run -p core-host --test chaos_test

      - name: Run tests
        run: cargo nextest run --workspace

      # nextest does not run doc tests; keep a separate cargo test --doc pass.
      - name: Run doc tests
        run: cargo test --doc --workspace

      - name: Generate core-host coverage
        run: cargo llvm-cov -p core-host --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: core-host-lcov-${{ github.sha }}
          if-no-files-found: error
          path: lcov.info

      - name: Check ai-inference host build
        run: cargo check -p core-host --features ai-inference

      - name: Check s3-persistence host build
        run: cargo check -p core-host --features s3-persistence

      - name: Build core-host in release mode
        run: cargo build -p core-host --release

      - name: Build tachyon-ui in release mode
        run: cargo build -p tachyon-ui --release

      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tachyon-mesh-build-${{ github.sha }}
          if-no-files-found: error
          path: |
            integrity.lock
            target/release/core-host
            target/release/tachyon-ui
            target/wasm32-wasip1/release/guest_ai.wasm
            target/wasm32-wasip2/release/guest_example.wasm
            target/wasm32-wasip2/release/guest_flaky.wasm
            target/wasm32-wasip2/release/guest_grpc.wasm
            target/wasm32-wasip1/release/guest_log_storm.wasm
            target/wasm32-wasip1/release/guest_tcp_echo.wasm
            target/wasm32-wasip2/release/guest_udp_echo.wasm
            target/wasm32-wasip2/release/guest_voip_gate.wasm
            target/wasm32-wasip2/release/guest_volume.wasm
            target/wasm32-wasip2/release/system_faas_bridge.wasm
            target/wasm32-wasip2/release/system_faas_authn.wasm
            target/wasm32-wasip2/release/system_faas_authz.wasm
            target/wasm32-wasip2/release/system_faas_cert_manager.wasm
            target/wasm32-wasip2/release/system_faas_cdc.wasm
            target/wasm32-wasip2/release/buffer.wasm
            target/wasm32-wasip2/release/system_faas_gc.wasm
            target/wasm32-wasip2/release/system_faas_gateway.wasm
            target/wasm32-wasip2/release/gossip.wasm
            target/wasm32-wasip1/release/guest_loop.wasm
            target/wasm32-wasip2/release/k8s_scaler.wasm
            target/wasm32-wasip2/release/system_faas_logger.wasm
            target/wasm32-wasip2/release/system_faas_model_broker.wasm
            target/wasm32-wasip2/release/metering.wasm
            target/wasm32-wasip2/release/metrics.wasm
            target/wasm32-wasip2/release/system_faas_registry.wasm
            target/wasm32-wasip2/release/scaling.wasm
            target/wasm32-wasip2/release/system_faas_s3_proxy.wasm
            target/wasm32-wasip2/release/system_faas_shadow_proxy.wasm
            target/wasm32-wasip2/release/system_faas_sqs.wasm
            target/wasm32-wasip2/release/system_faas_storage_broker.wasm

  # ── Feature matrix (5 parallel variants, shared Rust dependency cache). ───────
  # Sharing the cache across variants avoids recompiling the large common
  # dependency set (tokio, serde, wasmtime, …) five times. Only the default
  # variant writes to the shared cache; the others restore from it and do not
  # write, preventing cross-feature cache collisions.
  feature-matrix-tests:
    needs: build-guests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "--no-default-features"
          - "--all-features"
          - "--features http3"
          - "--features rate-limit,resiliency,mtls,secrets-vault,websockets"
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D dead_code"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-matrix
          save-if: ${{ matrix.features == '' }}

      - name: Install FIPS build dependencies
        if: matrix.features == '--all-features'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Download guest artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Test core-host feature set
        run: cargo nextest run -p core-host ${{ matrix.features }}

      - name: Build release binary for artifact
        run: cargo build -p core-host --release ${{ matrix.features }}

      - name: Derive artifact label from features
        id: feat_label
        shell: bash
        run: |
          case "${{ matrix.features }}" in
            "")                                                        label="default" ;;
            "--no-default-features")                                   label="no-default" ;;
            "--all-features")                                          label="all" ;;
            "--features http3")                                        label="http3" ;;
            "--features rate-limit,resiliency,mtls,secrets-vault,websockets") label="security" ;;
            *)                                                         label="custom" ;;
          esac
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Upload core-host binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-host-linux-x86_64-${{ steps.feat_label.outputs.label }}-${{ github.sha }}
          path: target/release/core-host
          if-no-files-found: error

  # ── FIPS tests ────────────────────────────────────────────────────────────────
  fips-tests:
    needs: build-guests
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - name: Install FIPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm protobuf-compiler

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Download guest artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-guests-${{ github.sha }}
      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Test core-host FIPS feature
        run: cargo nextest run -p core-host --features fips

      - name: Build FIPS release binary for artifact
        run: cargo build -p core-host --release --features fips

      - name: Upload FIPS core-host binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-host-linux-x86_64-fips-${{ github.sha }}
          path: target/release/core-host
          if-no-files-found: error

  # ── Mutation tests (weekly schedule only) ────────────────────────────────────
  mutation-tests:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run auth mutation tests
        run: cargo mutants --package core-host --file core-host/src/auth.rs --timeout 120

  # ── Miri cwasm cache (weekly schedule only) ───────────────────────────────────
  miri-cwasm-cache:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup

      - name: Run cwasm cache Miri smoke test
        run: cargo +nightly miri test -p core-host cwasm_cache_deserializes_same_engine_component --no-default-features

  # ── Publish Docker images (push to main only, waits for rust-ci) ──────────────
  publish-docker-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust-ci
    runs-on: ubuntu-latest
    env:
      BUILDKIT_PROGRESS: plain
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "s3-persistence"
            feature_tag: ""
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile.fips
            context: .
            cargo_features: ""
            feature_tag: "-fips"
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "http3"
            feature_tag: "-http3"
          - image_name: tachyon-mesh
            dockerfile: ./Dockerfile
            context: .
            cargo_features: "rate-limit,resiliency,mtls,secrets-vault,websockets"
            feature_tag: "-security"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.feature_tag }}
            type=sha,prefix=sha-,suffix=${{ matrix.feature_tag }}
            type=raw,value=latest${{ matrix.feature_tag }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_FEATURES=${{ matrix.cargo_features }}
          cache-from: type=gha,scope=${{ matrix.feature_tag || 'default' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.feature_tag || 'default' }}
