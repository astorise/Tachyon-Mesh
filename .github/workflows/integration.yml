name: k3d-integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      desktop_qualification:
        description: Build desktop installers on Linux, macOS and Windows without publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k3d-integration:
    # Renovate dependency PRs are validated by the compile-only fast lane in
    # ci.yml (see the note at the top of that file); the docker/k3d stack is
    # skipped for them and runs again on the merge push to main.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # The two image builds plus the k3d/containerd image imports below are
      # disk-heavy and have intermittently exhausted the ~14 GB free on
      # ubuntu-latest runners ("No space left on device"). Reclaim the large
      # preinstalled toolchains this job never uses before building.
      - name: Free up disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"; df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Shared GHA cache scope with publish-docker-images and the other E2E
      # workflows: the FaaS/system wasm + legacy-mock layers are
      # feature-independent (the cargo-feature ARG comes later in the
      # Dockerfile), so a cache hit here skips ~15 min of compilation.
      - name: Build tachyon-mesh image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          tags: tachyon-mesh:test
          load: true
          cache-from: type=gha,scope=docker-default
          cache-to: type=gha,mode=max,scope=docker-default

      - name: Build legacy-mock image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: legacy-runtime
          tags: legacy-mock:test
          load: true
          cache-from: type=gha,scope=docker-default
          cache-to: type=gha,mode=max,scope=docker-default

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -L -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Create cluster and import local images
        run: |
          k3d cluster create tachyon-mesh --wait
          k3d image import tachyon-mesh:test legacy-mock:test -c tachyon-mesh
          docker save tachyon-mesh:test legacy-mock:test | docker exec -i k3d-tachyon-mesh-server-0 ctr -n k8s.io images import -
          docker exec k3d-tachyon-mesh-server-0 crictl images | grep -E 'tachyon-mesh|legacy-mock'
          for attempt in $(seq 1 30); do
            if kubectl cluster-info >/tmp/k3d-cluster-info.log 2>&1; then
              cat /tmp/k3d-cluster-info.log
              break
            fi
            cat /tmp/k3d-cluster-info.log
            sleep 2
            if [ "$attempt" -eq 30 ]; then
              echo "cluster API did not become ready after image import"
              exit 1
            fi
          done
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Deploy workload
        run: |
          # Patch to use locally-built test images (CI cannot pull from GHCR).
          # legacy-deployment/legacy-service live in deploy-legacy-e2e.yaml,
          # not deploy.yaml itself — concatenated here so this workflow's
          # applied manifest is unchanged; deploy.yaml stays the clean
          # Quick Start file the README points operators at.
          cat manifests/deploy.yaml manifests/deploy-legacy-e2e.yaml | sed \
            -e 's|ghcr.io/astorise/tachyon-mesh:latest|tachyon-mesh:test|g' \
            -e 's|imagePullPolicy: Always|imagePullPolicy: Never|g' \
            | kubectl apply -f -
          kubectl rollout status deployment/tachyon-host --timeout=300s
          kubectl rollout status deployment/legacy-deployment --timeout=300s

      - name: Verify hybrid mesh traffic matrix
        run: |
          kubectl port-forward service/tachyon-service 8080:8080 >/tmp/tachyon-port-forward.log 2>&1 &
          TACHYON_PORT_FORWARD_PID=$!
          kubectl port-forward service/legacy-service 8081:8081 >/tmp/legacy-port-forward.log 2>&1 &
          LEGACY_PORT_FORWARD_PID=$!

          cleanup() {
            kill "${TACHYON_PORT_FORWARD_PID}" "${LEGACY_PORT_FORWARD_PID}" || true
          }

          trap cleanup EXIT

          retry_curl() {
            local output_file="$1"
            shift
            local success=0

            for attempt in $(seq 1 20); do
              if curl --fail --show-error --silent "$@" >"${output_file}"; then
                success=1
                break
              fi

              sleep 2
            done

            if [ "${success}" -ne 1 ]; then
              cat /tmp/tachyon-port-forward.log || true
              cat /tmp/legacy-port-forward.log || true
              return 1
            fi
          }

          assert_contains() {
            local expected="$1"
            local file="$2"

            if ! grep -F "${expected}" "${file}" >/dev/null; then
              echo "Expected response to contain: ${expected}"
              cat "${file}" || true
              exit 1
            fi
          }

          retry_curl /tmp/legacy-direct.txt http://127.0.0.1:8081/ping
          assert_contains "legacy_ok" /tmp/legacy-direct.txt

          # /metrics is a system route always present in the default manifest.
          retry_curl /tmp/metrics.txt http://127.0.0.1:8080/metrics
          assert_contains "tachyon_" /tmp/metrics.txt

          # legacy-mock calls tachyon /metrics via FAAS_URL; verify the call succeeds.
          retry_curl /tmp/legacy-to-faas.txt --request POST http://127.0.0.1:8081/call-faas
          assert_contains "tachyon_" /tmp/legacy-to-faas.txt

      - name: Show diagnostics on failure
        if: failure()
        run: |
          k3d cluster list || true
          kubectl get pods -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl describe deployment/tachyon-host || true
          kubectl describe deployment/legacy-deployment || true
          kubectl describe pod -l app=tachyon-host || true
          kubectl describe pod -l app=legacy-mock || true
          kubectl logs deployment/tachyon-host || true
          kubectl logs deployment/legacy-deployment || true
          cat /tmp/tachyon-port-forward.log || true
          cat /tmp/legacy-port-forward.log || true

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete tachyon-mesh || true

  # Independent clients exercise the real Tachyon router and WASM guests on
  # loopback. These jobs intentionally test the supported unary/H3 subset;
  # streaming RPCs, QUIC Retry and 0-RTT need separate conformance coverage.
  grpc-interop:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.24.7
          cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: grpc-interop
      - name: Install the official grpc-go interop client
        run: go install google.golang.org/grpc/interop/client@v1.75.1
      - name: Build the interop guest
        run: cargo build --locked -p guest-grpc-interop --target wasm32-wasip2
      - name: Run official empty and large unary cases
        run: |
          set -euo pipefail
          export TACHYON_GRPC_INTEROP_CLIENT="$(go env GOPATH)/bin/client"
          test_name=host_core::tests::http_router::grpc_go_official_unary_interoperability
          cargo test --locked -p core-host --bin core-host "$test_name" -- --ignored --exact | tee "$RUNNER_TEMP/grpc-interop.log"
          grep -Fx "test ${test_name} ... ok" "$RUNNER_TEMP/grpc-interop.log"

  quic-interop:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: quic-http3-interop
      - name: Install the independently implemented QUIC client
        run: python -m pip install --require-hashes -r tests/conformance/quic/requirements.txt
      - name: Build the HTTP/3 guest
        run: cargo build --locked -p guest-example --target wasm32-wasip2
      - name: Run verified TLS and concurrent HTTP/3 requests with aioquic
        run: |
          set -euo pipefail
          export TACHYON_AIOQUIC_PYTHON="$(command -v python)"
          test_name=host_core::tests::l4_tls_quic::aioquic_http3_interoperability
          cargo test --locked -p core-host --bin core-host --features http3 "$test_name" -- --ignored --exact | tee "$RUNNER_TEMP/quic-interop.log"
          grep -Fx "test ${test_name} ... ok" "$RUNNER_TEMP/quic-interop.log"

  # This is deliberately a build-only qualification of the selected SHA:
  # tauri-action receives neither a tag nor a release ID and cannot publish.
  desktop-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_qualification }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_targets: ''
            args: --bundles appimage,deb
            artifact_path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact_path: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            rust_targets: ''
            args: --bundles msi,nsis
            artifact_path: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: false
      CARGO_HTTP_TIMEOUT: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Verify the selected commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tachyon-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop-qualification-${{ matrix.platform }}-${{ matrix.rust_targets }}
          workspaces: |
            . -> target
      - name: Install Linux system dependencies for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev libfuse2 patchelf || \
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf
      - name: Install frontend dependencies
        working-directory: tachyon-ui
        run: npm ci
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path tachyon-ui/Cargo.toml
      - name: Build desktop installers without publication
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tachyon-ui
          args: ${{ matrix.args }}
      - name: Require every expected installer type
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              ls target/release/bundle/appimage/*.AppImage >/dev/null
              ls target/release/bundle/deb/*.deb >/dev/null
              ;;
            macOS)
              ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg >/dev/null
              ;;
            Windows)
              ls target/release/bundle/msi/*.msi >/dev/null
              ls target/release/bundle/nsis/*.exe >/dev/null
              ;;
            *) exit 1 ;;
          esac
      - name: Verify the MSI ProductVersion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem target/release/bundle/msi/*.msi)
          if ($msis.Count -ne 1) { throw "Expected one MSI, found $($msis.Count)" }
          $config = Get-Content -Raw tachyon-ui/tauri.conf.json | ConvertFrom-Json
          $expected = $config.bundle.windows.wix.version
          $database = (New-Object -ComObject WindowsInstaller.Installer).OpenDatabase($msis[0].FullName, 0)
          $view = $database.OpenView('SELECT `Value` FROM `Property` WHERE `Property` = ''ProductVersion''')
          $view.Execute()
          $record = $view.Fetch()
          if (!$record) { throw 'MSI ProductVersion is missing' }
          $actual = $record.StringData(1)
          if ($actual -notin @($expected, ($expected -replace '\.0$', ''))) {
            throw "MSI ProductVersion $actual does not match $expected"
          }
          Write-Host "MSI ProductVersion: $actual"
      - name: Upload qualification installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-qualification-${{ matrix.platform }}
          if-no-files-found: error
          path: ${{ matrix.artifact_path }}
          retention-days: 30
