name: k3d-integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k3d-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The two image builds plus the k3d/containerd image imports below are
      # disk-heavy and have intermittently exhausted the ~14 GB free on
      # ubuntu-latest runners ("No space left on device"). Reclaim the large
      # preinstalled toolchains this job never uses before building.
      - name: Free up disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"; df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Shared GHA cache scope with publish-docker-images and the other E2E
      # workflows: the FaaS/system wasm + legacy-mock layers are
      # feature-independent (the cargo-feature ARG comes later in the
      # Dockerfile), so a cache hit here skips ~15 min of compilation.
      - name: Build tachyon-mesh image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: tachyon-mesh:test
          load: true
          cache-from: type=gha,scope=docker-default
          cache-to: type=gha,mode=max,scope=docker-default

      - name: Build legacy-mock image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: legacy-runtime
          tags: legacy-mock:test
          load: true
          cache-from: type=gha,scope=docker-default
          cache-to: type=gha,mode=max,scope=docker-default

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -L -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Create cluster and import local images
        run: |
          k3d cluster create tachyon-mesh --wait
          k3d image import tachyon-mesh:test legacy-mock:test -c tachyon-mesh
          docker save tachyon-mesh:test legacy-mock:test | docker exec -i k3d-tachyon-mesh-server-0 ctr -n k8s.io images import -
          docker exec k3d-tachyon-mesh-server-0 crictl images | grep -E 'tachyon-mesh|legacy-mock'
          for attempt in $(seq 1 30); do
            if kubectl cluster-info >/tmp/k3d-cluster-info.log 2>&1; then
              cat /tmp/k3d-cluster-info.log
              break
            fi
            cat /tmp/k3d-cluster-info.log
            sleep 2
            if [ "$attempt" -eq 30 ]; then
              echo "cluster API did not become ready after image import"
              exit 1
            fi
          done
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Deploy workload
        run: |
          # Patch to use locally-built test images (CI cannot pull from GHCR)
          sed \
            -e 's|ghcr.io/astorise/tachyon-mesh:latest|tachyon-mesh:test|g' \
            -e 's|imagePullPolicy: Always|imagePullPolicy: Never|g' \
            manifests/deploy.yaml | kubectl apply -f -
          kubectl rollout status deployment/tachyon-host --timeout=300s
          kubectl rollout status deployment/legacy-deployment --timeout=300s

      - name: Verify hybrid mesh traffic matrix
        run: |
          kubectl port-forward service/tachyon-service 8080:8080 >/tmp/tachyon-port-forward.log 2>&1 &
          TACHYON_PORT_FORWARD_PID=$!
          kubectl port-forward service/legacy-service 8081:8081 >/tmp/legacy-port-forward.log 2>&1 &
          LEGACY_PORT_FORWARD_PID=$!

          cleanup() {
            kill "${TACHYON_PORT_FORWARD_PID}" "${LEGACY_PORT_FORWARD_PID}" || true
          }

          trap cleanup EXIT

          retry_curl() {
            local output_file="$1"
            shift
            local success=0

            for attempt in $(seq 1 20); do
              if curl --fail --show-error --silent "$@" >"${output_file}"; then
                success=1
                break
              fi

              sleep 2
            done

            if [ "${success}" -ne 1 ]; then
              cat /tmp/tachyon-port-forward.log || true
              cat /tmp/legacy-port-forward.log || true
              return 1
            fi
          }

          assert_contains() {
            local expected="$1"
            local file="$2"

            if ! grep -F "${expected}" "${file}" >/dev/null; then
              echo "Expected response to contain: ${expected}"
              cat "${file}" || true
              exit 1
            fi
          }

          retry_curl /tmp/legacy-direct.txt http://127.0.0.1:8081/ping
          assert_contains "legacy_ok" /tmp/legacy-direct.txt

          # /metrics is a system route always present in the default manifest.
          retry_curl /tmp/metrics.txt http://127.0.0.1:8080/metrics
          assert_contains "tachyon_" /tmp/metrics.txt

          # legacy-mock calls tachyon /metrics via FAAS_URL; verify the call succeeds.
          retry_curl /tmp/legacy-to-faas.txt --request POST http://127.0.0.1:8081/call-faas
          assert_contains "tachyon_" /tmp/legacy-to-faas.txt

      - name: Show diagnostics on failure
        if: failure()
        run: |
          k3d cluster list || true
          kubectl get pods -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl describe deployment/tachyon-host || true
          kubectl describe deployment/legacy-deployment || true
          kubectl describe pod -l app=tachyon-host || true
          kubectl describe pod -l app=legacy-mock || true
          kubectl logs deployment/tachyon-host || true
          kubectl logs deployment/legacy-deployment || true
          cat /tmp/tachyon-port-forward.log || true
          cat /tmp/legacy-port-forward.log || true

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete tachyon-mesh || true

  grpc-interop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build gRPC interop guest
        run: cargo build -p guest-grpc-interop --target wasm32-wasip2 --release

      - name: Run gRPC Interop
        run: |
          docker run --rm grpc/go:latest \
            go run google.golang.org/grpc/interop/client \
            --server_host=127.0.0.1 \
            --server_port=8080 \
            --use_tls=false \
            --test_case=empty_unary

  quic-interop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run QUIC Interop
        run: docker compose -f tests/conformance/quic/docker-compose.yml config
