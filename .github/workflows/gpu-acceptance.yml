name: GPU Acceptance

# Proofs that need a real device to mean anything, kept out of the per-PR
# `cuda-quality` job because they want an installed checkpoint and minutes of
# wall clock rather than a compile and a lint. `workflow_dispatch` runs them on
# demand; the weekly schedule finds a silent break within days instead of at
# the next release.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

# The GPU pool is the scarce resource and these jobs each want most of a
# device's memory. Serialised so they fail honestly rather than failing each
# other.
concurrency:
  group: gpu-acceptance
  cancel-in-progress: false

# Everything below is opt-in on `TACHYON_ENABLE_NVFP4_CI`, and the reason is
# the checkpoint rather than the hardware: candle #3831 dropped the FP4
# tensor-core floor, so the kernel itself runs anywhere CUDA does, but these
# tests need the Qwen 3.5 NVFP4 weights installed on the runner and each one
# returns early without them. Opting in is what turns those early returns into
# hard requirements: a GPU job that silently tests nothing is worse than one
# that fails. `cuda-quality` needs neither, and is no longer gated.
jobs:
  qwen35-nvfp4:
    name: Qwen 3.5 NVFP4 checkpoint
    if: ${{ vars.TACHYON_ENABLE_NVFP4_CI == '1' }}
    runs-on: arc-gpu-runners
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with `cuda-quality`: the CUDA dependency build is the
          # expensive part and it is byte-identical between the two.
          shared-key: cuda-quality
          cache-on-failure: true

      - name: Put CUDA toolkit on PATH
        run: |
          echo "PATH=$PATH"
          echo "CUDA_HOME=${CUDA_HOME:-<unset>} CUDA_PATH=${CUDA_PATH:-<unset>}"
          nvcc_bin=""
          # 1. Already on PATH?
          if command -v nvcc >/dev/null 2>&1; then
            nvcc_bin="$(command -v nvcc)"
          fi
          # 2. Well-known install roots.
          if [ -z "$nvcc_bin" ]; then
            for cuda in "${CUDA_HOME:-}" "${CUDA_PATH:-}" \
                        /usr/local/cuda /usr/local/cuda-* \
                        /opt/cuda /opt/cuda-* /usr/lib/cuda /usr/cuda; do
              if [ -n "$cuda" ] && [ -x "$cuda/bin/nvcc" ]; then
                nvcc_bin="$cuda/bin/nvcc"
                break
              fi
            done
          fi
          # 3. Last resort: bounded search of likely roots.
          if [ -z "$nvcc_bin" ]; then
            nvcc_bin="$(find /usr /opt -maxdepth 5 -name nvcc -type f -executable 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$nvcc_bin" ]; then
            echo "::error::nvcc not found on this runner. The CUDA *toolkit* (not just the driver) must be installed in the arc-gpu-runners image. nvidia-smi alone is not enough — candle-kernels/cudarc compile .cu kernels with nvcc at build time."
            echo "--- diagnostics ---"
            echo "ls /usr/local:"; ls -la /usr/local 2>/dev/null || true
            echo "ls /opt:";       ls -la /opt 2>/dev/null || true
            echo "dpkg cuda pkgs:"; dpkg -l 2>/dev/null | grep -i cuda || echo "  (none)"
            exit 1
          fi
          cuda_root="$(dirname "$(dirname "$nvcc_bin")")"
          echo "Found nvcc at $nvcc_bin (CUDA root: $cuda_root)"
          echo "$(dirname "$nvcc_bin")" >> "$GITHUB_PATH"
          echo "CUDA_PATH=$cuda_root" >> "$GITHUB_ENV"
          echo "CUDA_HOME=$cuda_root" >> "$GITHUB_ENV"

      - name: Verify CUDA toolchain
        run: |
          nvidia-smi
          nvcc --version

      # Build for whatever this runner actually is. The architecture is read
      # from the device rather than pinned, so the kernel is compiled for the
      # GPU that will run it. The job-level gate already decided this job runs
      # at all; repeating it here would only be a second place to get wrong.
      - name: Configure NVFP4 CUDA architecture
        run: |
          compute_capability="$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -n1 | tr -d '[:space:].')"
          if [ -z "$compute_capability" ]; then
            echo "::error::failed to determine GPU compute capability for NVFP4 CUDA build"
            exit 1
          fi
          # Blackwell's FP4 tensor-core instructions only compile for the
          # architecture-specific `a` target. Deriving the name by removing the
          # decimal point alone turns capability 10.0 into `sm_100`, which
          # builds — silently without the instructions this job exists to
          # exercise, or fails in the kernel compile. Families that have no `a`
          # variant keep the plain name.
          case "$compute_capability" in
            100|101|103|120|121) arch="sm_${compute_capability}a" ;;
            *) arch="sm_${compute_capability}" ;;
          esac
          echo "TACHYON_NVFP4_CUDA_ARCH=$arch" >> "$GITHUB_ENV"
          echo "Using NVFP4 CUDA architecture $arch"

      # candle-onnx's build script compiles the ONNX .proto and needs `protoc`.
      # The CPU jobs get it from `apt-get install protobuf-compiler`, but this
      # GPU runner image is RPM/UBI-based (no apt), so install protoc in a
      # distro-agnostic way. Skipped if the runner image already ships protoc.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Every test below returns early when the checkpoint is missing, so
      # without this the job would go green having executed nothing.
      - name: Require the installed checkpoint
        run: |
          : "${TACHYON_QWEN35_MOE_NVFP4_DIR:?missing TACHYON_QWEN35_MOE_NVFP4_DIR}"
          test -d "$TACHYON_QWEN35_MOE_NVFP4_DIR"

      # The batched prefill's only safety argument is that chunk size does not
      # change the result. There is no synthetic Qwen 3.5 fixture, so this
      # runner is the only place that claim is ever tested.
      - name: Prefill chunking equivalence
        run: |
          cargo test -p core-host --bin core-host \
            --features candle-cuda \
            gated_prefill_is_invariant_to_chunk_size -- --nocapture

      # The proof that decides whether `qwen35_moe_runtime.rs` can be deleted.
      #
      # This briefly set `TACHYON_QWEN35_DEQUANTIZED_FALLBACK`, because the
      # kernel refused to run below compute capability 10.0 and the comparison
      # had to reach it somehow. candle #3831 established that nothing in the
      # kernel needs FP4 tensor cores, so the packed path — the one that is
      # actually shipped — now runs on any CUDA device, and the comparison runs
      # against the real thing rather than an approximation of it.
      - name: Upstream layers match the scalar runtime
        run: |
          cargo test -p core-host --bin core-host \
            --features candle-cuda \
            gated_upstream_layers_agree_with_the_scalar_runtime -- --nocapture

      # `gated_a_gpu_route_runs_the_kernel_or_refuses_to_load` is the one that
      # makes this step mean something: it asks for the accelerator and fails
      # if the load answers with the host path. The refusal used to be bought
      # with `TACHYON_NVFP4_NATIVE_REQUIRED=1` here, which asked about hardware
      # from outside the process and — because every other test in this filter
      # requests `cpu` — would have refused the whole step rather than
      # sharpening it.
      - name: Native NVFP4 execution
        run: |
          cargo test -p core-host --bin core-host \
            --features candle-cuda \
            qwen35_moe_runtime::tests::gated_ -- --nocapture

      # Reported, not gated on a threshold: absolute throughput belongs to the
      # runner. The log history is where a regression becomes visible, and the
      # test itself only fails on growth that is wrong at any speed.
      - name: Prefill scaling
        env:
          TACHYON_QWEN35_PREFILL_BENCH: "1"
        run: |
          cargo test -p core-host --bin core-host \
            --features candle-cuda \
            gated_prefill_scaling -- --nocapture
