name: GPU Acceptance

# Proofs that need a real device to mean anything, kept out of the per-PR
# `cuda-quality` job because they want an installed checkpoint and minutes of
# wall clock rather than a compile and a lint. `workflow_dispatch` runs them on
# demand; the weekly schedule finds a silent break within days instead of at
# the next release.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

# The GPU pool is the scarce resource and these jobs each want most of a
# device's memory. Serialised so they fail honestly rather than failing each
# other.
concurrency:
  group: gpu-acceptance
  cancel-in-progress: false

# Nothing here is gated on hardware. candle #3831 dropped the FP4 tensor-core
# floor, so the kernel runs anywhere CUDA does — a device without the tensor
# cores takes the fallback and answers the same tokens more slowly, which is a
# performance difference rather than a correctness one. `cuda-quality` is
# ungated for that reason.
#
# What this job does need is the Qwen 3.5 NVFP4 weights installed on the
# runner: every test below returns early without them, so an unconfigured run
# would go green having executed nothing. `TACHYON_QWEN35_MOE_NVFP4_DIR` is
# where an operator says the weights are there, so it is also the whole
# condition for running — a repository without it skips, and a repository with
# it runs and fails honestly if the path is wrong. A second opt-in flag beside
# it only made it possible to configure a checkpoint and still silently test
# nothing.
#
# `if:` cannot read the runner's own environment, so exporting the variable
# from the runner image no longer enables the job on its own; the repository
# variable is what turns it on.
jobs:
  qwen35-nvfp4:
    name: Qwen 3.5 NVFP4 checkpoint
    if: ${{ vars.TACHYON_QWEN35_MOE_NVFP4_DIR != '' }}
    runs-on: arc-gpu-runners
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with `cuda-quality`: the CUDA dependency build is the
          # expensive part and it is byte-identical between the two.
          shared-key: cuda-quality
          cache-on-failure: true

      - name: Put CUDA toolkit on PATH
        run: |
          echo "PATH=$PATH"
          echo "CUDA_HOME=${CUDA_HOME:-<unset>} CUDA_PATH=${CUDA_PATH:-<unset>}"
          nvcc_bin=""
          # 1. Already on PATH?
          if command -v nvcc >/dev/null 2>&1; then
            nvcc_bin="$(command -v nvcc)"
          fi
          # 2. Well-known install roots.
          if [ -z "$nvcc_bin" ]; then
            for cuda in "${CUDA_HOME:-}" "${CUDA_PATH:-}" \
                        /usr/local/cuda /usr/local/cuda-* \
                        /opt/cuda /opt/cuda-* /usr/lib/cuda /usr/cuda; do
              if [ -n "$cuda" ] && [ -x "$cuda/bin/nvcc" ]; then
                nvcc_bin="$cuda/bin/nvcc"
                break
              fi
            done
          fi
          # 3. Last resort: bounded search of likely roots.
          if [ -z "$nvcc_bin" ]; then
            nvcc_bin="$(find /usr /opt -maxdepth 5 -name nvcc -type f -executable 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$nvcc_bin" ]; then
            echo "::error::nvcc not found on this runner. The CUDA *toolkit* (not just the driver) must be installed in the arc-gpu-runners image. nvidia-smi alone is not enough — candle-kernels/cudarc compile .cu kernels with nvcc at build time."
            echo "--- diagnostics ---"
            echo "ls /usr/local:"; ls -la /usr/local 2>/dev/null || true
            echo "ls /opt:";       ls -la /opt 2>/dev/null || true
            echo "dpkg cuda pkgs:"; dpkg -l 2>/dev/null | grep -i cuda || echo "  (none)"
            exit 1
          fi
          cuda_root="$(dirname "$(dirname "$nvcc_bin")")"
          echo "Found nvcc at $nvcc_bin (CUDA root: $cuda_root)"
          echo "$(dirname "$nvcc_bin")" >> "$GITHUB_PATH"
          echo "CUDA_PATH=$cuda_root" >> "$GITHUB_ENV"
          echo "CUDA_HOME=$cuda_root" >> "$GITHUB_ENV"

      - name: Verify CUDA toolchain
        run: |
          nvidia-smi
          nvcc --version

      # candle-onnx's build script compiles the ONNX .proto and needs `protoc`.
      # The CPU jobs get it from `apt-get install protobuf-compiler`, but this
      # GPU runner image is RPM/UBI-based (no apt), so install protoc in a
      # distro-agnostic way. Skipped if the runner image already ships protoc.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Every test below returns early when the checkpoint is missing, so
      # without this the job would go green having executed nothing.
      #
      # The job only starts when the repository variable is set, so what is
      # left to catch here is a value that is set and wrong: a typo, or a
      # volume that did not mount on this runner. That has to fail rather than
      # skip — it is the case where an operator believes the weights are being
      # exercised.
      - name: Require the installed checkpoint
        run: |
          checkpoint="${{ vars.TACHYON_QWEN35_MOE_NVFP4_DIR }}"
          if [ ! -d "$checkpoint" ]; then
            echo "::error::TACHYON_QWEN35_MOE_NVFP4_DIR is \`$checkpoint\`, which is not a directory on this runner."
            exit 1
          fi
          echo "Using checkpoint $checkpoint"
          echo "TACHYON_QWEN35_MOE_NVFP4_DIR=$checkpoint" >> "$GITHUB_ENV"
          # The ModelOpt probe reads a different name, and nothing set it — so
          # that step ran a test that returned early, and the guard below could
          # not tell: it proves a filter matches a test, not that the test did
          # anything. The Qwen checkpoint *is* a ModelOpt/NVFP4 directory and
          # the probe asserts only what any such directory must satisfy, so it
          # is the default. A repository that keeps a separate probe checkpoint
          # overrides it.
          probe="${{ vars.TACHYON_MODEL_OPT_NVFP4_DIR }}"
          probe="${probe:-$checkpoint}"
          if [ ! -d "$probe" ]; then
            echo "::error::TACHYON_MODEL_OPT_NVFP4_DIR is \`$probe\`, which is not a directory on this runner."
            exit 1
          fi
          echo "Using ModelOpt probe checkpoint $probe"
          echo "TACHYON_MODEL_OPT_NVFP4_DIR=$probe" >> "$GITHUB_ENV"

      # Every step below filters by test name, and `cargo test` exits 0 when a
      # filter matches nothing. Deleting the scalar runtime made four of these
      # filters stale at once, and the job would have gone green having run
      # zero tests — the exact outcome the checkpoint requirement above exists
      # to prevent.
      #
      # Each filter is checked, not just "some gated test exists": with one
      # blanket check, renaming a single proof left the guard green while that
      # proof was silently skipped, because the other three still matched. The
      # filters below are the ones the steps use verbatim, and a libtest filter
      # is a substring match on the test path — which is exactly what `grep -F`
      # answers against the listing.
      - name: Require the gated tests to exist
        run: |
          set -o pipefail
          cargo test -p core-host --bin core-host \
            --features candle-cuda -- --list > /tmp/gated-tests.txt
          missing=0
          for filter in \
            gated_prefill_is_invariant_to_chunk_size \
            qwen35_upstream::tests::gated_ \
            gated_a_cuda_route_runs_the_kernel_or_refuses_to_load \
            gated_real_checkpoint_probe_loads_modelopt_nvfp4_directory
          do
            matched="$(grep -cF "$filter" /tmp/gated-tests.txt || true)"
            if [ "$matched" -eq 0 ]; then
              echo "::error::no test matches \`$filter\`; the step using it would run nothing"
              missing=1
            else
              echo "$filter -> $matched test(s)"
            fi
          done
          exit "$missing"

      # The prefill loop is still ours: `PREFILL_CHUNK_TOKENS` exists so the
      # deadline can be observed, and it rests on upstream's forward being
      # equivalent whether a prompt arrives in one pass or several.
      - name: Prefill chunking equivalence
        run: |
          cargo test -p core-host --bin core-host \
            --features candle-cuda \
            gated_prefill_is_invariant_to_chunk_size -- --nocapture

      # Since the scalar runtime went away, nothing else loads a real
      # checkpoint anywhere. This is the only coverage the loader has.
      - name: Load and generate on the installed checkpoint
        run: |
          cargo test -p core-host --bin core-host \
            --features candle-cuda \
            qwen35_upstream::tests::gated_ -- --nocapture

      # `gated_a_cuda_route_runs_the_kernel_or_refuses_to_load` is what makes
      # this step mean something: `auto_linear` hands back the packed *CPU*
      # operator on a CUDA device when `nvfp4-cuda` is not compiled in, which
      # answers with the same tokens off the wrong hardware.
      - name: Native NVFP4 execution
        run: |
          cargo test -p core-host --bin core-host \
            --features candle-cuda \
            gated_a_cuda_route_runs_the_kernel_or_refuses_to_load -- --nocapture

      # The ModelOpt directory parser, which survived the runtime it used to
      # feed and is still the gate every checkpoint passes through.
      - name: ModelOpt checkpoint probe
        run: |
          cargo test -p core-host --bin core-host \
            --features candle-cuda \
            gated_real_checkpoint_probe_loads_modelopt_nvfp4_directory -- --nocapture
