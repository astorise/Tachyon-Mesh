name: E2E K8s Operator

on:
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - "core-host/**"
      - "Dockerfile"
      - ".github/workflows/e2e-k8s.yml"
  pull_request:
    paths:
      - "manifests/**"
      - "Dockerfile"
      - ".github/workflows/e2e-k8s.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-k8s-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Shared GHA cache scope with publish-docker-images and the other E2E
      # workflows: the FaaS/system wasm + legacy-mock layers are
      # feature-independent (the cargo-feature ARG comes later in the
      # Dockerfile), so a cache hit here skips ~15 min of compilation.
      - name: Build local Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: tachyon-mesh:local
          load: true
          cache-from: type=gha,scope=docker-default
          cache-to: type=gha,mode=max,scope=docker-default

      - name: Install k3d
        run: |
          curl --fail --show-error --silent --location \
            -o k3d \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          chmod +x k3d
          sudo mv k3d /usr/local/bin/k3d
          k3d version

      - name: Set up k3d cluster
        run: |
          k3d cluster create tachyon-test \
            --agents 1 \
            --no-lb \
            --wait

      - name: Import local image into k3d
        run: k3d image import tachyon-mesh:local -c tachyon-test

      - name: Patch manifest to use local image
        run: |
          sed 's|ghcr.io/astorise/tachyon-mesh:latest|tachyon-mesh:local|g; s|imagePullPolicy: Always|imagePullPolicy: Never|g' \
            manifests/deploy.yaml > /tmp/deploy-local.yaml

      - name: Apply deploy manifest
        run: kubectl apply -f /tmp/deploy-local.yaml

      - name: Wait for tachyon-host deployment readiness
        run: |
          kubectl rollout status deployment/tachyon-host --timeout=300s

      - name: Basic API healthcheck
        run: |
          kubectl port-forward svc/tachyon-service 8080:8080 &
          PF_PID=$!
          sleep 4
          curl -f --retry 5 --retry-delay 2 http://localhost:8080/admin/status && echo "healthcheck passed"
          kill $PF_PID 2>/dev/null || true

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get deployments,pods,svc -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl describe deployment/tachyon-host || true
          kubectl describe pod -l app=tachyon-host || true
          kubectl logs deployment/tachyon-host --tail=200 || true

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete tachyon-test || true
