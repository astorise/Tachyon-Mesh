name: E2E K8s Operator

on:
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - "core-host/**"
      - "Dockerfile"
      - ".github/workflows/e2e-k8s.yml"
  pull_request:
    paths:
      - "manifests/**"
      - "Dockerfile"
      - ".github/workflows/e2e-k8s.yml"

permissions:
  contents: read

jobs:
  test-k8s-deployment:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev cmake nasm

      - name: Build core-host release binary
        run: cargo build --release --bin core-host

      - name: Build local Docker image
        run: docker build -t tachyon-mesh:local .

      - name: Install k3d
        run: |
          curl --fail --show-error --silent --location \
            -o k3d \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          chmod +x k3d
          sudo mv k3d /usr/local/bin/k3d
          k3d version

      - name: Set up k3d cluster
        run: |
          k3d cluster create tachyon-test \
            --agents 1 \
            --no-lb \
            --wait

      - name: Import local image into k3d
        run: k3d image import tachyon-mesh:local -c tachyon-test

      - name: Patch manifest to use local image
        run: |
          sed 's|ghcr.io/astorise/tachyon-mesh:latest|tachyon-mesh:local|g; s|imagePullPolicy: Always|imagePullPolicy: Never|g' \
            manifests/deploy.yaml > /tmp/deploy-local.yaml

      - name: Apply deploy manifest
        run: kubectl apply -f /tmp/deploy-local.yaml

      - name: Wait for tachyon-host pod readiness
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=tachyon-host \
            --timeout=120s

      - name: Basic API healthcheck
        run: |
          kubectl port-forward svc/tachyon-service 8080:8080 &
          PF_PID=$!
          sleep 4
          curl -f --retry 5 --retry-delay 2 http://localhost:8080/admin/status && echo "healthcheck passed"
          kill $PF_PID 2>/dev/null || true

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete tachyon-test || true
