name: Experiment — fips + musl natif (Alpine)

on:
  push:
    branches:
      - experiment/fips-musl-zigbuild
  workflow_dispatch:

jobs:
  # rust:alpine = Rust stable sur Alpine musl (pas de cross-compilation, pas de zigbuild).
  # Rust, cargo et la toolchain musl sont déjà en place dans cette image officielle.
  fips-musl-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: rust:alpine
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install build deps
        run: |
          apk add --no-cache \
            git bash \
            build-base cmake nasm \
            linux-headers musl-dev \
            openssl-dev pkgconf

      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: fips-musl-alpine

      - name: Build core-host — fips sur Alpine musl natif
        run: |
          cargo build -p core-host \
            --no-default-features \
            --features fips \
            --release 2>&1

      - name: Inspect binary
        if: success()
        run: |
          BIN=target/release/core-host
          echo "=== File type ==="
          file "$BIN"
          echo "=== Dynamic deps (doit être statically linked) ==="
          ldd "$BIN" || echo "(static — aucune dépendance dynamique)"
          echo "=== Size ==="
          du -sh "$BIN"
          echo "=== FIPS symbols ==="
          nm "$BIN" 2>/dev/null | grep -i "fips" | head -5 \
            || echo "(stripped)"

      - name: Summary
        if: always()
        run: |
          if [ -f target/release/core-host ]; then
            echo "SUCCESS — fips compile nativement sur Alpine musl"
          else
            echo "FAILED — voir les logs ci-dessus"
          fi
