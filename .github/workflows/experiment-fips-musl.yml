name: Experiment — fips + musl natif (Alpine)

on:
  push:
    branches:
      - experiment/fips-musl-zigbuild
  workflow_dispatch:

jobs:
  # Alpine utilise musl nativement — pas de cross-compilation, pas de zigbuild.
  # Les headers système (linux-headers) sont déjà musl-compatibles.
  fips-musl-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: alpine:3.21
    env:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /root/.cargo
    steps:
      - name: Install Alpine build deps
        run: |
          apk add --no-cache \
            bash curl git \
            build-base cmake nasm \
            linux-headers musl-dev \
            openssl-dev pkgconf \
            python3

      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: fips-musl-alpine

      - name: Build core-host — fips sur Alpine musl natif
        run: |
          # Sur Alpine, le target musl est le target par défaut (x86_64-unknown-linux-musl).
          # On peut aussi cibler explicitement pour être cohérent avec le Dockerfile.
          ~/.cargo/bin/cargo build -p core-host \
            --no-default-features \
            --features fips \
            --release \
            2>&1

      - name: Inspect binary
        if: success()
        run: |
          BIN=target/release/core-host
          echo "=== File type ==="
          file "$BIN"
          echo "=== Dynamic deps (doit être 'statically linked') ==="
          ldd "$BIN" || echo "(static — aucune dépendance dynamique)"
          echo "=== Size ==="
          du -sh "$BIN"
          echo "=== FIPS symbols ==="
          nm "$BIN" 2>/dev/null | grep -i "fips" | head -5 \
            || echo "(stripped — FIPS symbols non visibles)"

      - name: Summary
        if: always()
        run: |
          if [ -f target/release/core-host ]; then
            echo "SUCCESS — fips compile nativement sur Alpine musl"
          else
            echo "FAILED — voir les logs ci-dessus"
          fi
