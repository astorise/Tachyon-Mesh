name: Publish Docker images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize promotions, including re-runs. Never cancel a promotion in flight.
concurrency:
  group: publish-docker-images-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-ci:
    # workflow_run can also represent PR runs and runs from forks. The script
    # checks those fields again along with the individual security gates.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.id == github.event.repository.id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify exact successful CI run and required jobs
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Include previous attempts so a successful partial re-run retains
          # evidence for jobs that did not need to run again.
          gh api --paginate --slurp "repos/${REPO}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          python3 scripts/verify-docker-publish.py "$RUNNER_TEMP/ci-jobs.json"
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"

  build-images:
    needs: verify-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./Dockerfile
            cargo_features: s3-persistence
            feature_tag: ''
            artifact_key: default
            cache_scope: docker-default
          - dockerfile: ./Dockerfile.fips
            cargo_features: ''
            feature_tag: -fips
            artifact_key: fips
            cache_scope: docker-fips
          - dockerfile: ./Dockerfile
            cargo_features: http3
            feature_tag: -http3
            artifact_key: http3
            cache_scope: docker-default
          - dockerfile: ./Dockerfile
            cargo_features: rate-limit,resiliency,mtls,secrets-vault,websockets
            feature_tag: -security
            artifact_key: security
            cache_scope: docker-default
          - dockerfile: ./Dockerfile
            cargo_features: ai-inference,oci-artifacts,legacy-wasi-nn,ebpf-loader,experimental,http3,mtls,rate-limit,resiliency,s3-persistence,secrets-vault,websockets
            feature_tag: -all-features
            artifact_key: all-features
            cache_scope: docker-default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      # FIPS and all-features builds can exhaust the hosted runner before
      # Buildx reports an error; free the unused SDKs before creating it.
      - name: Free disk space for image builds
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare full-SHA image tag
        id: image
        env:
          SHA: ${{ needs.verify-ci.outputs.sha }}
          SUFFIX: ${{ matrix.feature_tag }}
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tachyon-mesh:sha-${SHA}${SUFFIX}" >> "$GITHUB_OUTPUT"
      # First push by the exact tested commit. No mutable latest/main tag is
      # changed until every matrix variant is successfully built.
      - name: Build and push image by SHA
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        continue-on-error: true
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-ci.outputs.sha }}
          build-args: CARGO_FEATURES=${{ matrix.cargo_features }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
      - name: Retry image push
        id: retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-ci.outputs.sha }}
          build-args: CARGO_FEATURES=${{ matrix.cargo_features }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
      - name: Record the digest actually produced by the build
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.retry.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/image-digest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-digest-${{ matrix.artifact_key }}
          path: ${{ runner.temp }}/image-digest.txt
          if-no-files-found: error

  promote-images:
    needs: [verify-ci, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ''
            artifact_key: default
          - suffix: -fips
            artifact_key: fips
          - suffix: -http3
            artifact_key: http3
          - suffix: -security
            artifact_key: security
          - suffix: -all-features
            artifact_key: all-features
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docker-digest-${{ matrix.artifact_key }}
          path: ${{ runner.temp }}/image-digest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only while this SHA is still the main tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.verify-ci.outputs.sha }}
          SUFFIX: ${{ matrix.suffix }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "$current" != "$SHA" ]; then
            echo "::notice::main moved to ${current}; leaving its mutable tags untouched."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tachyon-mesh"
          digest=$(cat "$RUNNER_TEMP/image-digest/image-digest.txt")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --tag "${image}:main${SUFFIX}" \
            --tag "${image}:latest${SUFFIX}" \
            --tag "${image}:sha-${SHA:0:7}${SUFFIX}" \
            "${image}@${digest}"
