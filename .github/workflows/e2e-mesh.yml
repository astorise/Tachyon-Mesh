name: E2E Mesh (vcluster)

on:
  push:
    branches: [main]
    paths:
      - "manifests/deploy-mesh.yaml"
      - "manifests/deploy.yaml"
      - "core-host/**"
      - "systems/system-faas-node-registry/**"
      - "Dockerfile"
      - "wit/**"
      - ".github/workflows/e2e-mesh.yml"
  pull_request:
    paths:
      - "manifests/deploy-mesh.yaml"
      - "Dockerfile"
      - "wit/**"
      - ".github/workflows/e2e-mesh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-vcluster:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VCLUSTER_NAME: tachyon-vc
      VCLUSTER_NAMESPACE: vcluster-tachyon
      KIND_CLUSTER: tachyon-host
      IMAGE_TAG: tachyon-mesh:e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Shared GHA cache scope with publish-docker-images and the other E2E
      # workflows: the FaaS/system wasm + legacy-mock layers are
      # feature-independent (the cargo-feature ARG comes later in the
      # Dockerfile), so a cache hit here skips ~15 min of compilation.
      - name: Build local Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha,scope=docker-default
          cache-to: type=gha,mode=max,scope=docker-default

      - name: Set up kind host cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          wait: 180s

      - name: Load image into kind
        run: kind load docker-image $IMAGE_TAG --name $KIND_CLUSTER

      - name: Install vcluster CLI
        uses: loft-sh/setup-vcluster@v0.0.1
        with:
          version: v0.34.0

      - name: Create vcluster
        run: |
          kubectl create namespace ${VCLUSTER_NAMESPACE}
          vcluster create ${VCLUSTER_NAME} \
            --namespace ${VCLUSTER_NAMESPACE} \
            --connect=false \
            --upgrade

      - name: Connect to vcluster
        run: |
          # --kube-config is deprecated in recent vcluster; use --background-proxy which
          # updates ~/.kube/config and switches the active context automatically.
          vcluster connect ${VCLUSTER_NAME} \
            --namespace ${VCLUSTER_NAMESPACE} \
            --background-proxy
          for i in $(seq 1 30); do
            if kubectl get ns >/dev/null 2>&1; then
              echo "vcluster reachable after ${i}s"
              break
            fi
            sleep 2
          done
          kubectl get ns

      - name: Patch manifest to use local image
        run: |
          sed 's|ghcr.io/astorise/tachyon-mesh:latest|tachyon-mesh:e2e|g; s|imagePullPolicy: Always|imagePullPolicy: Never|g' \
            manifests/deploy-mesh.yaml > /tmp/deploy-mesh-local.yaml

      - name: Deploy Tachyon mesh (3 replicas)
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          kubectl apply -f /tmp/deploy-mesh-local.yaml

      - name: Wait for StatefulSet rollout
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          kubectl rollout status statefulset/tachyon-mesh --timeout=240s
          kubectl get pods -l app=tachyon-mesh -o wide

      - name: Smoke test — pod logs (no crash on FaaS load)
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          for i in 0 1 2; do
            echo "==== tachyon-mesh-$i ===="
            kubectl logs tachyon-mesh-$i --tail=120 || true
          done

      - name: Smoke test — /admin/status reachable
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          kubectl port-forward tachyon-mesh-0 18080:8080 &
          PF=$!
          for i in $(seq 1 20); do
            sleep 1
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/admin/status || echo "000")
            if [ "$STATUS" != "000" ]; then break; fi
          done
          kill $PF 2>/dev/null || true
          echo "GET /admin/status -> $STATUS"
          case "$STATUS" in
            200|401|403)
              echo "core-host is alive and routing admin requests."
              ;;
            *)
              echo "Unexpected status $STATUS"
              exit 1
              ;;
          esac

      - name: Verify node-registry FaaS is loaded
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          set +e
          LOGS=$(kubectl logs tachyon-mesh-0 --tail=400)
          echo "$LOGS" | grep -Ei "node[_-]registry|system_faas_node_registry" > /tmp/registry-hits || true
          if [ -s /tmp/registry-hits ]; then
            echo "node-registry references found in logs:"
            cat /tmp/registry-hits
          else
            echo "No explicit node-registry log line found (this is non-fatal; the FaaS may load lazily on first admin request)."
          fi

      - name: Test persistence — delete pod-0, wait re-ready, check store survives
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          kubectl delete pod tachyon-mesh-0
          kubectl wait --for=condition=ready pod/tachyon-mesh-0 --timeout=180s
          kubectl exec tachyon-mesh-0 -- ls -la /app/data/ || echo "(data dir empty is OK — store path may differ)"
          kubectl logs tachyon-mesh-0 --tail=60

      - name: Collect vcluster diagnostics on failure
        if: failure()
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          kubectl describe pods -l app=tachyon-mesh || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true

      - name: Cleanup vcluster
        if: always()
        run: |
          vcluster delete ${VCLUSTER_NAME} --namespace ${VCLUSTER_NAMESPACE} || true
