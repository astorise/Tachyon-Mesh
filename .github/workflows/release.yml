name: Publish Tachyon Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Server-side binary tarballs (core-host + tachyon-mcp) ────────────────────
  # Published only on version tags; used by scripts/get-tachyon.sh.
  publish-server-binaries:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Two scalar dimensions that GitHub Actions cross-joins (5 × 6 = 30 jobs).
        # The `include` blocks below inject derived properties into each cell.
        platform:
          - ubuntu-x86_64
          - ubuntu-aarch64
          - macos-x86_64
          - macos-aarch64
          - windows-x86_64
        features:
          - default
          - fips
          - http3
          - security
          - ai
          - no-default
        include:
          # ── platform properties ──────────────────────────────────────────────
          - platform: ubuntu-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - platform: ubuntu-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: aarch64
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            os_name: darwin
            arch: x86_64
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: aarch64
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64
          # ── feature properties ───────────────────────────────────────────────
          - features: default
            features_label: ""
            cargo_args: ""
          - features: fips
            features_label: "-fips"
            cargo_args: "--no-default-features --features fips"
          - features: http3
            features_label: "-http3"
            cargo_args: "--features http3"
          - features: security
            features_label: "-security"
            cargo_args: "--features rate-limit,resiliency,mtls,secrets-vault,websockets"
          - features: ai
            features_label: "-ai"
            cargo_args: "--features ai-inference"
          - features: no-default
            features_label: "-no-default"
            cargo_args: "--no-default-features"
        exclude:
          # ai-inference links against ONNX Runtime which is not available for
          # aarch64 cross-compilation or Windows in this CI setup.
          - platform: ubuntu-aarch64
            features: ai
          - platform: windows-x86_64
            features: ai
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64 Linux)
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Linux system deps
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake nasm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      - name: Build core-host and tachyon-mcp
        run: |
          cargo build --release --bin core-host --bin tachyon-mcp \
            --target ${{ matrix.target }} ${{ matrix.cargo_args }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package archive (tar.gz on Linux/macOS, zip on Windows)
        id: pkg
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          OS="${{ matrix.os_name }}"
          ARCH="${{ matrix.arch }}"
          SUFFIX="${{ matrix.features_label }}"
          BINDIR="target/${{ matrix.target }}/release"
          if [ "$OS" = "windows" ]; then
            ARCHIVE="tachyon-mesh-${VERSION}-${OS}-${ARCH}${SUFFIX}.zip"
            if command -v 7z >/dev/null 2>&1; then
              7z a "${ARCHIVE}" \
                "${BINDIR}/core-host.exe" \
                "${BINDIR}/tachyon-mcp.exe"
            else
              zip "${ARCHIVE}" \
                "${BINDIR}/core-host.exe" \
                "${BINDIR}/tachyon-mcp.exe"
            fi
          else
            ARCHIVE="tachyon-mesh-${VERSION}-${OS}-${ARCH}${SUFFIX}.tar.gz"
            tar -czf "${ARCHIVE}" \
              -C "${BINDIR}" core-host tachyon-mcp \
              --transform "s|^|tachyon-mesh-${VERSION}/|" 2>/dev/null || \
            tar -czf "${ARCHIVE}" -C "${BINDIR}" core-host tachyon-mcp
          fi
          echo "tarball=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Calculate SHA-256 checksum
        id: checksum
        shell: bash
        run: |
          TARBALL="${{ steps.pkg.outputs.tarball }}"
          sha256sum "${TARBALL}" | awk '{print $1}' > "${TARBALL}.sha256"
          echo "checksum_file=${TARBALL}.sha256" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: runner.os != 'Windows'
        uses: sigstore/cosign-installer@v3

      - name: Sign binary archive with cosign (keyless OIDC)
        id: sign
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TARBALL="${{ steps.pkg.outputs.tarball }}"
          cosign sign-blob --yes "${TARBALL}" --bundle "${TARBALL}.bundle"
          echo "bundle_file=${TARBALL}.bundle" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (Linux only)
        id: sbom
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          cargo install cargo-sbom --locked
          SBOM="${{ steps.pkg.outputs.tarball }}-sbom.spdx.json"
          cargo sbom --output-format spdx_json_2_3 > "${SBOM}"
          echo "sbom_file=${SBOM}" >> "$GITHUB_OUTPUT"

      - name: Upload archive and supply-chain artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.checksum.outputs.checksum_file }}
            ${{ steps.sign.outputs.bundle_file }}
            ${{ steps.sbom.outputs.sbom_file }}

  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_targets: ""
            args: --bundles appimage,deb
            artifact_name: tachyon-desktop-linux
            artifact_path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact_name: tachyon-desktop-macos
            artifact_path: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            rust_targets: ""
            args: --bundles msi,nsis
            artifact_name: tachyon-desktop-windows
            artifact_path: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: false
      CARGO_HTTP_TIMEOUT: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tachyon-ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.platform }}-${{ matrix.rust_targets }}
          workspaces: |
            . -> target

      - name: Install Linux system dependencies for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
          || sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        working-directory: ./tachyon-ui
        run: npm install

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo fetch --locked --manifest-path tachyon-ui/Cargo.toml; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          cargo fetch --locked --manifest-path tachyon-ui/Cargo.toml

      - name: Generate Rust SBOM
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          cargo install cargo-sbom --locked
          cargo sbom --output-format spdx_json_2_3 > tachyon-mesh.spdx.json

      - name: Build Tauri bundles for push artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tachyon-ui
          args: ${{ matrix.args }}

      - name: Publish Tauri bundles for version tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tachyon-ui
          tagName: ${{ github.ref_name }}
          releaseName: Tachyon Desktop v__VERSION__
          releaseBody: See the assets to download and install this version.
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: tachyon-studio_[version]_[arch][ext]
          args: ${{ matrix.args }}

      - name: Upload desktop bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_path }}

      - name: Upload SBOM
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: tachyon-mesh-sbom
          if-no-files-found: error
          path: tachyon-mesh.spdx.json
