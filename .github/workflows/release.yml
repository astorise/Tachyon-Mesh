name: Publish Tachyon Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TACH-17/TACH-18: a `v*` tag can point at any commit, including one that
  # never ran CI's push trigger or ran it and failed -- this repo's
  # rulesets gate merges into `main`, not tag creation. Every job below
  # that can publish (contents: write / id-token: write) depends on this
  # one, so a tag can never ship from a commit whose quality/cuda-quality/
  # security-audit/build-guests jobs, from CI's own `push` run on `main`
  # specifically (never a `pull_request` run), aren't all green. The actual
  # check now lives in verify-tag-ci-green.yml (TACH-18) so publish-sdks.yml
  # -- a separate workflow file with its own real, external-registry
  # publish paths -- shares the exact same gate instead of going ungated or
  # drifting from a second copy of this script.
  verify-tag-ci-green:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # A reusable-workflow call is capped at what the calling job is granted
    # (never elevated) -- release.yml declares no workflow-level
    # `permissions`, so without this the calling job fell back to this
    # repo's default workflow permissions (no `actions`), while
    # verify-tag-ci-green.yml's job requests `actions: read`. GitHub
    # rejects that at workflow-parse time, before any job runs at all:
    # confirmed live on main (every push to main, not just a tag, failed
    # release.yml outright with `startup_failure` -- "the nested job
    # 'verify-tag-ci-green' is requesting 'actions: read', but is only
    # allowed 'actions: none'"). Same fix already applied to
    # publish-sdks.yml's workflow-level permissions; this one just needs
    # it at the job level instead, since this file's other jobs already
    # set their own job-level permissions and a workflow-level block here
    # would be needless blast radius.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-tag-ci-green.yml

  # TACH-34 (2026-10-29 audit): publish-integrity-schemas,
  # publish-server-binaries' matrix, and publish-tauri's matrix all
  # independently target the same GitHub Release for this tag --
  # softprops/action-gh-release (the first two) and tauri-apps/tauri-action
  # (the third, with releaseDraft: true) each decide for themselves whether
  # to create a new release or reuse an existing one, and that decision is
  # timing-dependent: whichever of the three build jobs finishes first
  # determines whether the tag's release exists yet, and in what draft
  # state, when the next one looks it up. The one real push/main run this
  # repo has exercised end to end never took the tag path at all, so this
  # has never actually been proven to resolve safely either way. This job
  # removes the timing dependency entirely by creating the release as a
  # draft before any of the three build jobs starts, so none of them ever
  # has to decide whether to create one -- it already exists, in the exact
  # draft state every one of their own calls now expects (see the `draft:
  # true` added to publish-integrity-schemas'/publish-server-binaries' own
  # upload steps below). finalize-release, after all three complete, is
  # the one place that flips it to published.
  create-draft-release:
    name: Create the draft GitHub Release this tag's jobs upload into
    needs: verify-tag-ci-green
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create (or reuse) this tag's release as a draft, with no assets yet
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          name: Tachyon Mesh ${{ github.ref_name }}

  # TACH-42 (2026-10-30 audit): moved here from publish-sdks.yml, which
  # triggered this job off the exact same `push: tags: v*.*.*` event this
  # file already listens for -- two independent workflows, each free to
  # succeed or fail on its own, with no coordination between "the GitHub
  # Release is published" and "the WIT contracts actually reached GHCR".
  # A real tag push could finalize the Release while this job failed
  # silently in the other workflow, or the reverse. Folding it into this
  # file's own draft/finalize lifecycle (TACH-34) -- needed by
  # finalize-release below, same as every other build job -- makes the
  # publication ordered: finalize-release never flips the Release to
  # published unless this job succeeded. This is not atomic: a successful
  # GHCR push can remain visible if the later GitHub Release step fails.
  publish-wit-oci:
    name: Publish WIT contracts to GHCR (OCI)
    needs: [verify-tag-ci-green, create-draft-release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install wkg (Wasm Package Tools)
        run: cargo install wkg --version 0.16.1 --locked

      - name: Stage tachyon:mesh's own file into an isolated package root
        # TACH-33 (2026-10-29 audit, originally in publish-sdks.yml):
        # `./wit` is a flat directory holding MANY independent WIT
        # packages as siblings of tachyon:mesh (tachyon:identity,
        # tachyon:*-config, tachyon:accelerator, tachyon:storage, ...) --
        # confirmed by reproducing `wkg publish ./wit --dry-run` directly:
        # it fails WIT resolution with "package identifier
        # `tachyon:ai-config@1.1.0` does not match previous package name
        # of `tachyon:identity@1.1.0`" before ever reaching GHCR, because
        # wkg tries to build the whole directory as one package.
        #
        # wit/tachyon.wit alone is the correct, self-sufficient publish
        # target: its own header names it "the single source of truth for
        # all Tachyon Mesh WIT interfaces" and says not to fork worlds or
        # create -with-X variants; it builds standalone with zero
        # resolution errors (verified the same way: build, then decode
        # with `wasm-tools component wit`, and compare against the file's
        # own content); and sdk/wit/tachyon.wit (the consumer-facing SDK
        # subset) never references any interface/world that only the
        # other WIT files in this directory declare.
        run: |
          set -euo pipefail
          STAGE_DIR="$(mktemp -d)"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"
          cp wit/tachyon.wit "${STAGE_DIR}/"
          echo "Staged tachyon:mesh file(s) into ${STAGE_DIR}:"
          find "$STAGE_DIR" -name '*.wit' | sort

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry-run preflight (build and resolve, no push)
        # TACH-33 (2026-10-29 audit): catches a broken build/resolve before
        # attempting the real, one-shot publish below.
        run: |
          set -euo pipefail
          # This file only ever triggers off a real `push: tags:` event
          # (no workflow_dispatch), so github.ref_name IS the tag that
          # authorized it -- no separate resolve-publish-target indirection
          # needed here the way publish-sdks.yml's workflow_dispatch path
          # required.
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${{ github.repository_owner }}"
          wkg publish \
            --registry ghcr.io \
            --package "${OWNER}:tachyon-mesh-wit@${VERSION}" \
            --dry-run \
            "${STAGE_DIR}"

      - name: Package and publish WIT contracts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${{ github.repository_owner }}"

          echo "Publishing WIT contracts as ghcr.io/${OWNER}/tachyon-mesh-wit:${VERSION}"

          # wkg 0.16.1's `publish` has no separate --namespace/--version
          # flags -- it takes a single combined
          # `<namespace>:<name>@<version>` via --package.
          wkg publish \
            --registry ghcr.io \
            --package "${OWNER}:tachyon-mesh-wit@${VERSION}" \
            "${STAGE_DIR}"

      - name: Report published artifact target
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${{ github.repository_owner }}"
          echo "wkg publish completed for ghcr.io/${OWNER}/tachyon-mesh-wit:${VERSION}; independent consumer resolution is still required."

  publish-integrity-schemas:
    needs: [verify-tag-ci-green, create-draft-release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Generate versioned integrity schemas
        run: cargo run -p core-host -- schema --output-dir target/schemas --release-tag "${{ github.ref_name }}"

      - name: Upload schema assets to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # TACH-34 (2026-10-29 audit): keep the release a draft while
          # uploading -- create-draft-release owns creating and finalize-
          # release owns publishing it. Omitting `draft` here (its default
          # is false) would publish the release the instant this step's
          # upload lands, racing every other job that also targets it.
          draft: true
          files: |
            target/schemas/integrity-config.schema.json
            target/schemas/integrity-lock.schema.json

  # ── Server-side binary tarballs (core-host + tachyon-mcp) ────────────────────
  # Published only on version tags; used by scripts/get-tachyon.sh.
  publish-server-binaries:
    needs: [verify-tag-ci-green, create-draft-release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Two scalar dimensions that GitHub Actions cross-joins (5 platforms
        # x 7 features = 35 combinations before `exclude`, 29 after --
        # stale "5 x 6 = 30" comment fixed per the 2026-10-29 audit; TACH-22
        # added the 7th feature, `ai-cuda`, without updating this count).
        # The `include` blocks below inject derived properties into each cell.
        platform:
          - ubuntu-x86_64
          - ubuntu-aarch64
          - macos-x86_64
          - macos-aarch64
          - windows-x86_64
        features:
          - default
          - fips
          - http3
          - security
          - ai
          - ai-cuda
          - no-default
        include:
          # ── platform properties ──────────────────────────────────────────────
          - platform: ubuntu-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - platform: ubuntu-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: aarch64
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            os_name: darwin
            arch: x86_64
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: aarch64
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64
          # ── feature properties ───────────────────────────────────────────────
          - features: default
            features_label: ""
            cargo_args: ""
          - features: fips
            features_label: "-fips"
            cargo_args: "--no-default-features --features fips"
          - features: http3
            features_label: "-http3"
            cargo_args: "--features http3"
          - features: security
            features_label: "-security"
            # rate-limit/resiliency/mtls/websockets now ship in core-host's
            # own `default` feature set; secrets-vault is what this variant
            # still adds on top of it.
            cargo_args: "--features secrets-vault"
          # TACH-22 (2026-10-28 audit): previously just `ai-inference`, which
          # excludes the OCI Component resolver (`oci-artifacts`) this exact
          # binary needs to pull a `magnetar:`/`oci://...` binding -- the two
          # features are independent in core-host/Cargo.toml, so declaring
          # only `ai-inference` built a variant that advertises AI support
          # but can't do the registry-sourced loading TACH-10/13 added.
          - features: ai
            features_label: "-ai"
            cargo_args: "--features ai-inference,oci-artifacts"
          # New alongside `ai` (TACH-22): the portable `ai` variant above
          # never links CUDA, so a GPU operator had no precompiled binary at
          # all for `magnetar-cuda`. Verified this links and runs fine with
          # no CUDA Toolkit present at build time (dynamic-loading + NVRTC
          # at runtime -- confirmed via `cargo check --features magnetar-cuda`
          # on a Toolkit-less sandbox): it's purely a missing feature flag,
          # not a build-infra gap, so this needs no self-hosted GPU runner,
          # same `os: ubuntu-22.04` as the rest of this platform row.
          # Linux x86_64 only, per the audit's own recommendation -- CUDA has
          # no macOS/aarch64 story here and Windows already excludes `ai`
          # below for the same ONNX Runtime reason this variant would
          # inherit.
          - features: ai-cuda
            features_label: "-ai-cuda"
            cargo_args: "--features ai-inference,oci-artifacts,magnetar-cuda"
          - features: no-default
            features_label: "-no-default"
            cargo_args: "--no-default-features"
        exclude:
          # ai-inference links against ONNX Runtime which is not available for
          # aarch64 cross-compilation or Windows in this CI setup.
          - platform: ubuntu-aarch64
            features: ai
          - platform: windows-x86_64
            features: ai
          # ai-cuda (TACH-22): Linux x86_64 only -- see the matrix comment
          # above for why.
          - platform: ubuntu-aarch64
            features: ai-cuda
          - platform: macos-x86_64
            features: ai-cuda
          - platform: macos-aarch64
            features: ai-cuda
          - platform: windows-x86_64
            features: ai-cuda
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64 Linux)
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Linux system deps
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake nasm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      - name: Build core-host and tachyon-mcp
        run: |
          cargo build --release --bin core-host --bin tachyon-mcp \
            --target ${{ matrix.target }} ${{ matrix.cargo_args }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package archive (tar.gz on Linux/macOS, zip on Windows)
        id: pkg
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          OS="${{ matrix.os_name }}"
          ARCH="${{ matrix.arch }}"
          SUFFIX="${{ matrix.features_label }}"
          BINDIR="target/${{ matrix.target }}/release"
          if [ "$OS" = "windows" ]; then
            ARCHIVE="tachyon-mesh-${VERSION}-${OS}-${ARCH}${SUFFIX}.zip"
            # TACH-31 (2026-10-29 audit follow-up): zip/7z store paths as
            # given, so passing "${BINDIR}/core-host.exe" would embed the
            # whole target/<triple>/release/ directory tree inside the
            # archive instead of a flat core-host.exe at its root --
            # get-tachyon.ps1's Expand-Archive has no --strip-components
            # equivalent and assumes the same flat layout the Linux/macOS
            # tarball already gets from tar's own -C flag below. cd into
            # BINDIR first and archive bare filenames so the two match.
            ARCHIVE_ABS="$(pwd)/${ARCHIVE}"
            if command -v 7z >/dev/null 2>&1; then
              (cd "${BINDIR}" && 7z a "${ARCHIVE_ABS}" core-host.exe tachyon-mcp.exe)
            else
              (cd "${BINDIR}" && zip "${ARCHIVE_ABS}" core-host.exe tachyon-mcp.exe)
            fi
          else
            # TACH-27A (2026-10-29 audit): no --transform wrapping the
            # contents in a tachyon-mesh-${VERSION}/ root directory.
            # scripts/get-tachyon.sh extracts flat (`tar -xzf ... -C
            # "$TARGET_DIR"`, no --strip-components) and expects
            # core-host/tachyon-mcp directly at the archive root -- the old
            # --transform (a GNU tar extension BSD tar on macOS silently
            # doesn't support, so this previously only wrapped Linux
            # archives, never macOS ones) broke that contract specifically
            # for Linux. Flat, unwrapped contents on every platform is what
            # the installer already assumes; keep it that way instead of
            # teaching the installer to strip a root directory. Kept in sync
            # with installer-contract-smoke-test-linux in ci.yml, which
            # packages with this exact command.
            ARCHIVE="tachyon-mesh-${VERSION}-${OS}-${ARCH}${SUFFIX}.tar.gz"
            tar -czf "${ARCHIVE}" -C "${BINDIR}" core-host tachyon-mcp
          fi
          echo "tarball=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Calculate SHA-256 checksum
        id: checksum
        shell: bash
        run: |
          TARBALL="${{ steps.pkg.outputs.tarball }}"
          sha256sum "${TARBALL}" | awk '{print $1}' > "${TARBALL}.sha256"
          echo "checksum_file=${TARBALL}.sha256" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binary archive with cosign (keyless OIDC)
        id: sign
        shell: bash
        run: |
          TARBALL="${{ steps.pkg.outputs.tarball }}"
          cosign sign-blob --yes "${TARBALL}" --bundle "${TARBALL}.bundle"
          echo "bundle_file=${TARBALL}.bundle" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (Linux only)
        id: sbom
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          cargo install cargo-sbom --version 0.10.0 --locked
          SBOM="${{ steps.pkg.outputs.tarball }}-sbom.spdx.json"
          cargo sbom --output-format spdx_json_2_3 > "${SBOM}"
          echo "sbom_file=${SBOM}" >> "$GITHUB_OUTPUT"

      - name: Upload archive and supply-chain artifacts to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # TACH-34 (2026-10-29 audit): see the matching comment on
          # publish-integrity-schemas' own upload step -- same reasoning.
          draft: true
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.checksum.outputs.checksum_file }}
            ${{ steps.sign.outputs.bundle_file }}
            ${{ steps.sbom.outputs.sbom_file }}

  publish-tauri:
    needs: [verify-tag-ci-green, create-draft-release]
    # always() bypasses the implicit needs-success gate: verify-tag-ci-green
    # and create-draft-release (TACH-34) are both themselves skipped (not
    # failed) on every ordinary push to main, and a skipped dependency
    # would otherwise skip this job too. The condition below is the real
    # gate -- block only the tag-triggered release path, and only when
    # either dependency actually ran and did not succeed.
    if: ${{ always() && (!startsWith(github.ref, 'refs/tags/v') || (needs.verify-tag-ci-green.result == 'success' && needs.create-draft-release.result == 'success')) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_targets: ""
            args: --bundles appimage,deb
            artifact_name: tachyon-desktop-linux
            artifact_path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact_name: tachyon-desktop-macos
            artifact_path: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            rust_targets: ""
            args: --bundles msi,nsis
            artifact_name: tachyon-desktop-windows
            artifact_path: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: false
      CARGO_HTTP_TIMEOUT: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tachyon-ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: tauri-${{ matrix.platform }}-${{ matrix.rust_targets }}
          workspaces: |
            . -> target

      - name: Install Linux system dependencies for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
          || sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        working-directory: ./tachyon-ui
        # TACH-38 (2026-10-29 audit): tachyon-ui has a committed
        # package-lock.json, but this step used npm install anyway --
        # ignoring the lock on exactly the reproducibility-sensitive path
        # that builds the signed release bundle. npm ci (verified against
        # the real lockfile: `npm ci --dry-run` succeeds cleanly) is what
        # the SDK JS publish pipeline already uses for the same reason.
        run: npm ci

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo fetch --locked --manifest-path tachyon-ui/Cargo.toml; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          cargo fetch --locked --manifest-path tachyon-ui/Cargo.toml

      - name: Generate Rust SBOM
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          cargo install cargo-sbom --version 0.10.0 --locked
          cargo sbom --output-format spdx_json_2_3 > tachyon-mesh.spdx.json

      - name: Build Tauri bundles for push artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tachyon-ui
          args: ${{ matrix.args }}

      - name: Publish Tauri bundles for version tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tachyon-ui
          tagName: ${{ github.ref_name }}
          releaseName: Tachyon Desktop v__VERSION__
          releaseBody: See the assets to download and install this version.
          releaseDraft: true
          prerelease: false
          # There is no configured/signed updater. Avoid publishing an empty
          # latest.json independently from the actual desktop bundles.
          uploadUpdaterJson: false
          releaseAssetNamePattern: tachyon-studio_[version]_[arch][ext]
          args: ${{ matrix.args }}

      - name: Upload desktop bundles
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_path }}

      - name: Upload SBOM
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tachyon-mesh-sbom
          if-no-files-found: error
          path: tachyon-mesh.spdx.json

  # TACH-34 (2026-10-29 audit): the one place that owns ending this tag's
  # Release lifecycle. By the time this runs, create-draft-release already
  # owns the start of it and every build job above has finished uploading
  # into that same draft -- `needs:` below fails this job closed (default
  # GitHub Actions behavior, no override) if any of them didn't succeed,
  # so a partially-uploaded release is never published.
  #
  # TACH-42 (2026-10-30 audit): publish-wit-oci added to this list -- see
  # its own comment above. The GitHub Release and the WIT GHCR artifact
  # are ordered: this job never succeeds unless the WIT publish did too.
  # A later failure cannot roll back the earlier GHCR push.
  finalize-release:
    name: Finalize and publish the GitHub Release
    needs: [create-draft-release, publish-integrity-schemas, publish-server-binaries, publish-tauri, publish-wit-oci]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Inspect and verify every expected release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/releases/tags/${TAG}" > "$RUNNER_TEMP/release.json"
          release_id=$(jq -er '.id' "$RUNNER_TEMP/release.json")
          gh api --paginate --slurp "repos/${REPO}/releases/${release_id}/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$TAG" --repo "$REPO" --dir "$RUNNER_TEMP/release-assets" \
            --pattern '*.sha256' --pattern 'integrity-*.schema.json' \
            --pattern "tachyon-mesh-${TAG}-linux-x86_64.tar.gz" \
            --pattern "tachyon-mesh-${TAG}-linux-x86_64.tar.gz.bundle"
          ui_version=$(jq -er '.version' tachyon-ui/tauri.conf.json)
          python3 scripts/verify-release-assets.py --tag "$TAG" --ui-version "$ui_version" \
            --release "$RUNNER_TEMP/release.json" --assets "$RUNNER_TEMP/assets.json" \
            --downloaded "$RUNNER_TEMP/release-assets" --commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/release-manifest.json"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify representative archive's release-workflow signature
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release-assets/tachyon-mesh-${TAG}-linux-x86_64.tar.gz"
          escaped_tag=${TAG//./\\.}
          cosign verify-blob --bundle "${archive}.bundle" \
            --certificate-identity-regexp "(?i)^https://github\\.com/${REPO}/\\.github/workflows/release\\.yml@refs/tags/${escaped_tag}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"

      - name: Attach the verified digest inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$REPO" "$RUNNER_TEMP/release-manifest.json" --clobber
          release_id=$(jq -er '.id' "$RUNNER_TEMP/release.json")
          gh api --paginate --slurp "repos/${REPO}/releases/${release_id}/assets?per_page=100" > "$RUNNER_TEMP/assets-after.json"
          expected="sha256:$(sha256sum "$RUNNER_TEMP/release-manifest.json" | cut -d ' ' -f 1)"
          actual=$(jq -er '[.[][] | select(.name == "release-manifest.json" and .state == "uploaded") | .digest] | if length == 1 then .[0] else empty end' "$RUNNER_TEMP/assets-after.json")
          test "$actual" = "$expected"

      - name: Publish the release (flip draft -> published)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
