name: Mutation Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"
  CARGO_MUTANTS_VERSION: "27.0.0"

jobs:
  prepare-wasm-guests:
    name: prepare wasm guests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: mutation-wasm-guests
          cache-on-failure: true

      - name: Build guest artifacts
        run: bash scripts/build-guest-artifacts.sh

      - name: Pack guest artifacts
        run: tar -czf wasm-guests.tar.gz target/wasm32-wasip1/release/*.wasm target/wasm32-wasip2/release/*.wasm

      - name: Upload guest artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-guests-${{ github.sha }}
          path: wasm-guests.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Run baseline core-host tests once
        run: cargo test -p core-host

  auth-mutation-shard:
    name: auth mutation shard ${{ matrix.shard }}
    needs: prepare-wasm-guests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants uses 0-indexed shards: --shard k/n requires k < n.
        include:
          - shard: 0/8
            id: 1
          - shard: 1/8
            id: 2
          - shard: 2/8
            id: 3
          - shard: 3/8
            id: 4
          - shard: 4/8
            id: 5
          - shard: 5/8
            id: 6
          - shard: 6/8
            id: 7
          - shard: 7/8
            id: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: mutation-tests-core-host-auth
          cache-on-failure: true

      - name: Install cargo-mutants
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}

      - name: Download guest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-guests-${{ github.sha }}

      - name: Unpack guest artifacts
        run: tar -xzf wasm-guests.tar.gz

      - name: Run auth mutation tests
        run: |
          cargo mutants \
            --package core-host \
            --file core-host/src/auth.rs \
            --shard "${{ matrix.shard }}" \
            --sharding round-robin \
            --jobs 2 \
            --baseline skip \
            --timeout 300 \
            --copy-target true \
            --output "mutants-auth-shard-${{ matrix.id }}"

      - name: Upload mutation output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-auth-shard-${{ matrix.id }}-${{ github.sha }}
          path: mutants-auth-shard-${{ matrix.id }}
          if-no-files-found: ignore
          retention-days: 14
