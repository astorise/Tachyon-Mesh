name: Publish SDKs

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install SDK generators
        run: |
          cargo install wit-bindgen-cli --locked
          npm install --global @bytecodealliance/jco
          pipx install poetry

      - name: Generate Rust SDK
        run: |
          wit-bindgen rust sdk/wit --out-dir sdk/rust/src/generated
          cargo package --manifest-path sdk/rust/Cargo.toml

      - name: Generate JavaScript SDK
        run: |
          cd sdk/js
          npm ci || npm install
          npm run build

      - name: Build Python SDK
        run: |
          cd sdk/python
          poetry build

      - name: Check Go SDK
        run: |
          cd sdk/go
          go mod tidy

      - name: Publish Rust SDK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --manifest-path sdk/rust/Cargo.toml --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Publish JavaScript SDK
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --prefix sdk/js --access public --//registry.npmjs.org/:_authToken="${{ secrets.NPM_TOKEN }}"

      - name: Publish Python SDK
        if: startsWith(github.ref, 'refs/tags/v')
        run: poetry publish --directory sdk/python --username __token__ --password "${{ secrets.PYPI_TOKEN }}"

  publish-wit-oci:
    name: Publish WIT contracts to GHCR (OCI)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install wkg (Wasm Package Tools)
        run: cargo install wkg --locked

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish WIT contracts
        run: |
          # Strip the leading 'v' from the tag: v1.2.3 -> 1.2.3
          VERSION="${GITHUB_REF#refs/tags/v}"
          OWNER="${{ github.repository_owner }}"
          REGISTRY="ghcr.io"
          PACKAGE="tachyon-mesh-wit"

          echo "Publishing WIT contracts as ${REGISTRY}/${OWNER}/${PACKAGE}:${VERSION}"

          # wkg publish uses the OCI distribution spec to push the ./wit directory
          # as a wasm-component-package artifact. The --version flag must be a
          # valid semver string (no 'v' prefix).
          wkg publish \
            --registry "${REGISTRY}" \
            --namespace "${OWNER}" \
            --package  "${PACKAGE}" \
            --version  "${VERSION}" \
            ./wit

      - name: Verify published artifact
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          OWNER="${{ github.repository_owner }}"
          echo "Published ghcr.io/${OWNER}/tachyon-mesh-wit:${VERSION}"
