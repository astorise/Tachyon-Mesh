name: Publish SDKs

# TACH-18: mirrors the safety discipline astorise/Magnetar's
# release-publication.yml established for its own crates.io publish --
# "First Real Publication Is Manually Triggered" and "Credential-Gated
# Publish Steps Fail Closed". Before this fix, every step below that calls
# `cargo publish`/`npm publish`/`poetry publish` ran unconditionally on any
# `v*.*.*` tag push, with no dry run, no manual confirmation, and no check
# that CARGO_REGISTRY_TOKEN/NPM_TOKEN/PYPI_TOKEN were even configured --
# unlike release.yml's own publish jobs (TACH-17), this workflow file had
# no verify-tag-ci-green gate at all. Pushing a tag was, by itself, enough
# to attempt a real publish to three external, third-party package
# registries no `git tag -d` can ever undo.
#
# dry-run-publish-sdks now runs unconditionally, with no credential, on
# every trigger -- it is the one job this workflow should keep green with
# no secrets configured. publish-sdks (the real `cargo publish`/`npm
# publish`/`poetry publish`) only runs on a manual `workflow_dispatch`, and
# fails closed with an explicit message if a required secret is not
# configured, rather than attempting the call and surfacing whatever
# registry-side auth error comes back.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          The exact v*.*.* tag to publish the SDKs from (e.g. v1.0.0).
          Required (TACH-32, 2026-10-29 audit): a workflow_dispatch run can
          be started from any ref GitHub's dispatch UI happens to have
          selected (main, by default) -- without pinning to this explicit
          tag, the real publish could end up signing off on whatever
          untagged commit main was sitting at, under a version number that
          was never actually released. Ignored for a tag-push trigger,
          which already resolves to the tagged commit directly.
        required: true
        type: string

permissions:
  contents: read
  # verify-tag-ci-green.yml's job requests `actions: read` (to list workflow
  # runs/jobs on the tagged commit) -- a reusable workflow call is capped at
  # the calling job's own granted permissions (never elevated), so without
  # this the gate's `gh api .../actions/...` calls would 403 and the real
  # SDK publish, and publish-wit-oci, could never run.
  actions: read

jobs:
  # TACH-32 (2026-10-29 audit): resolves the exact commit and SemVer to
  # publish from, before anything else runs. For a tag push, github.sha IS
  # already the tagged commit -- this is a no-op pass-through. For a
  # workflow_dispatch, this is the ONLY thing standing between "publish the
  # SDKs" and "publish whatever untagged commit main happened to be at when
  # someone clicked the button": it explicitly checks out the required
  # `tag` input (failing closed if that tag doesn't exist) and makes every
  # downstream job -- the CI gate included -- operate on that exact commit,
  # never on whatever ref the dispatch run's own default context implies.
  resolve-publish-target:
    name: Resolve the exact commit/version to publish from
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Validate the workflow_dispatch tag input
        if: github.event_name == 'workflow_dispatch'
        # TACH-32 follow-up (2026-10-29 audit): `${{ inputs.tag }}` is
        # substituted into this step's script TEXT before bash ever parses
        # it -- so a value like `v1.0.0$(printf INJECTED >&2)` executes
        # that command substitution as part of constructing the script,
        # before the regex check below is ever reached, regardless of what
        # the regex would have concluded (confirmed: this exact value
        # prints INJECTED and exits 0, bypassing the intended rejection).
        # Passing the input through `env:` instead assigns it to a shell
        # variable directly -- no secondary shell parsing of its contents
        # -- so the script below only ever sees it as inert string data via
        # `"$TAG_INPUT"`.
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'tag' input '${TAG_INPUT}' is not a valid vX.Y.Z[-pre] tag name." >&2
            exit 1
          fi

      - name: Checkout the exact ref to publish from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On workflow_dispatch this explicitly resolves the required
          # `tag` input, regardless of which ref the dispatch run itself
          # was started from; a tag that doesn't exist fails this checkout
          # outright, closed. On any other trigger, github.sha already IS
          # the exact commit to use (push: tags: can only ever be the
          # tagged commit itself).
          #
          # Qualified as `refs/tags/<tag>` rather than the bare tag name:
          # actions/checkout's ref resolution checks matching BRANCHES
          # before TAGS for an unqualified ref, so a branch sharing the
          # tag's name could otherwise silently shadow the intended tag.
          # A fully-qualified ref removes that ambiguity entirely.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 1

      - name: Resolve commit SHA and SemVer from the checked-out ref
        id: resolve
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$TAG_INPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${tag} -> commit ${sha}, SemVer ${version}"

  verify-tag-ci-green:
    needs: resolve-publish-target
    uses: ./.github/workflows/verify-tag-ci-green.yml
    with:
      target_sha: ${{ needs.resolve-publish-target.outputs.sha }}

  dry-run-publish-sdks:
    name: publish-sdks / dry run (no credential required)
    needs: resolve-publish-target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-publish-target.outputs.sha }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.7"

      - name: Install SDK generators
        # componentize-py and wit-bindgen-go (TACH-41, 2026-10-30 audit):
        # real generators for the Python and Go SDKs' bindings, the same
        # role jco/wit-bindgen already play for JavaScript/Rust above --
        # before this, sdk/python and sdk/go shipped no generated bindings
        # at all (sdk/python's __init__.py was a bare version string; Go
        # had no generate step and wasn't even published).
        run: |
          npm install --global @bytecodealliance/jco@1.40.0
          pipx install poetry==2.5.1
          pip install --user componentize-py==0.25.1
          go install go.bytecodealliance.org/cmd/wit-bindgen-go@v0.7.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify SDK manifest versions match the resolved tag's SemVer
        # TACH-32 (2026-10-29 audit): catches a tag whose own checked-out
        # content doesn't actually carry the version the tag name claims --
        # e.g. a tag cut before a version bump landed, or cut against the
        # wrong commit -- before either the dry run or (downstream) the
        # real publish ever runs against it.
        run: |
          set -euo pipefail
          expected="${{ needs.resolve-publish-target.outputs.version }}"
          rust_version="$(grep -m1 '^version' sdk/rust/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          js_version="$(node -p "require('./sdk/js/package.json').version")"
          py_version="$(grep -m1 '^version' sdk/python/pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          mismatch=0
          for pair in "Rust:${rust_version}" "JavaScript:${js_version}" "Python:${py_version}"; do
            name="${pair%%:*}"
            got="${pair#*:}"
            if [ "$got" != "$expected" ]; then
              echo "::error::${name} SDK manifest version '${got}' does not match the resolved tag's SemVer '${expected}'." >&2
              mismatch=1
            fi
          done
          if [ "$mismatch" -ne 0 ]; then
            exit 1
          fi
          echo "Rust/JavaScript/Python SDK manifests all report ${expected}, matching the resolved tag."

      - name: Generate Rust SDK
        run: |
          cargo package --manifest-path sdk/rust/Cargo.toml

      - name: Generate JavaScript SDK
        run: |
          cd sdk/js
          npm ci
          npm run build

      - name: Generate Python SDK (drift check against committed bindings)
        # TACH-41 (2026-10-30 audit): componentize-py's `bindings` command
        # only emits typed, documented stubs (every method body raises
        # NotImplementedError) -- componentize-py's own `componentize`
        # step swaps in the real Component Model ABI calls when a guest
        # app is actually bundled. That's real, by-design behavior (JS's
        # jco types below works the same way), not a placeholder we forgot
        # to finish -- what this check catches is sdk/wit/tachyon.wit
        # drifting from the generated/committed bindings sdk/python ships.
        run: |
          set -euo pipefail
          rm -rf /tmp/py-bindgen-check
          mkdir -p /tmp/py-bindgen-check
          componentize-py -d sdk/wit -w kv-consumer bindings /tmp/py-bindgen-check
          mismatch=0
          for path in wit_world componentize_py_async_support componentize_py_types.py componentize_py_runtime.pyi poll_loop.py; do
            if ! diff -rq "sdk/python/${path}" "/tmp/py-bindgen-check/${path}" >/dev/null; then
              echo "::error file=sdk/python/${path}::drifted from what componentize-py generates for the kv-consumer world -- regenerate with 'componentize-py -d ../wit -w kv-consumer bindings .' from sdk/python and commit the result." >&2
              diff -rq "sdk/python/${path}" "/tmp/py-bindgen-check/${path}" || true
              mismatch=1
            fi
          done
          if [ "$mismatch" -ne 0 ]; then
            exit 1
          fi
          echo "sdk/python's generated bindings match componentize-py's current output."

      - name: Build Python SDK
        run: |
          cd sdk/python
          poetry build

      - name: Generate Go SDK (drift check against committed bindings)
        # TACH-41 (2026-10-30 audit): wit-bindgen-go emits real, complete
        # Component Model ABI glue (go:wasmimport declarations), unlike
        # componentize-py's stubs above -- this is the same kind of real
        # bindings Rust's wit_bindgen::generate! already produces. What
        # this check catches is sdk/go/wit/tachyon.wit (vendored, kept in
        # sync by scripts/check_wit_sdk_sync.sh) drifting from the
        # committed sdk/go/gen tree.
        run: |
          set -euo pipefail
          rm -rf /tmp/go-bindgen-check
          mkdir -p /tmp/go-bindgen-check
          wit-bindgen-go generate -w kv-consumer -o /tmp/go-bindgen-check -p github.com/astorise/Tachyon-Mesh/sdk/go/gen sdk/go/wit
          if ! diff -rq sdk/go/gen /tmp/go-bindgen-check >/dev/null; then
            echo "::error file=sdk/go/gen::drifted from what wit-bindgen-go generates for the kv-consumer world -- regenerate with 'go generate ./...' from sdk/go and commit the result." >&2
            diff -rq sdk/go/gen /tmp/go-bindgen-check || true
            exit 1
          fi
          echo "sdk/go/gen matches wit-bindgen-go's current output."

      - name: Build and vet Go SDK
        # Mainline Go's gc compiler can typecheck this package (and does
        # here, for CI coverage with no extra toolchain) but cannot link
        # it for wasip1/wasip2 -- go:wasmimport only accepts flat scalar
        # parameter types there; wit-bindgen-go's generated Result/List/
        # Tuple-typed signatures require TinyGo's wasm backend instead
        # (see sdk/go/generate.go and sdk/go/README.md).
        run: |
          cd sdk/go
          go build ./...
          go vet ./...

      - name: cargo publish --dry-run (Rust SDK)
        run: cargo publish --manifest-path sdk/rust/Cargo.toml --dry-run

      - name: npm publish --dry-run (JavaScript SDK)
        # `--prefix` does not redirect npm publish's target package the way
        # it does for e.g. `npm install` -- it still reads ./package.json
        # from the invocation's cwd (the repo root here, which has none) and
        # fails with ENOENT. Passing the directory as npm publish's own
        # <package-spec> argument is what actually selects sdk/js.
        run: npm publish ./sdk/js --access public --dry-run

      - name: poetry publish --dry-run (Python SDK)
        # TACH-40 (2026-10-30 audit): Poetry has supported `publish
        # --dry-run` since well before the 2.5.1 pinned elsewhere in this
        # file (confirmed via `poetry publish --help`: "Perform all
        # actions except upload the package.", and it runs with no
        # PYPI_TOKEN configured) -- the prior comment here claiming no
        # dry-run mode exists was simply wrong.
        run: poetry publish --directory sdk/python --dry-run

  publish-sdks:
    name: publish-sdks / real publish (manual only)
    needs: [resolve-publish-target, verify-tag-ci-green, dry-run-publish-sdks]
    # "First Real Publication Is Manually Triggered" (Magnetar
    # release-publication.yml precedent): never runs automatically off a
    # tag push or a published GitHub Release, only an explicit
    # workflow_dispatch, until a human has confirmed the dry run end to
    # end on this exact ref.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # TACH-41 (2026-10-30 audit): needed to push the sdk/go/vX.Y.Z module tag below
    steps:
      # TACH-32 (2026-10-29 audit): checks out the exact commit
      # resolve-publish-target resolved from the required `tag` input --
      # never whatever ref this dispatch run's own default context
      # implies. This is what makes the version-mismatch check two jobs
      # up (dry-run-publish-sdks) actually mean something here too: both
      # jobs publish from the identical, explicitly-pinned commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-publish-target.outputs.sha }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.7"

      - name: Install SDK generators
        run: |
          npm install --global @bytecodealliance/jco@1.40.0
          pipx install poetry==2.5.1
          pip install --user componentize-py==0.25.1
          go install go.bytecodealliance.org/cmd/wit-bindgen-go@v0.7.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate Rust SDK
        run: |
          cargo package --manifest-path sdk/rust/Cargo.toml

      - name: Generate JavaScript SDK
        run: |
          cd sdk/js
          npm ci
          npm run build

      - name: Generate Python SDK
        # componentize-py's `bindings` command asserts its output paths
        # don't already exist -- harmless for a one-shot generate-into-a-
        # temp-dir drift check (dry-run-publish-sdks), but this job
        # regenerates in place over a tree already checked out with these
        # same committed paths, so they're cleared first.
        run: |
          rm -rf sdk/python/wit_world sdk/python/componentize_py_async_support \
            sdk/python/componentize_py_types.py sdk/python/componentize_py_runtime.pyi \
            sdk/python/poll_loop.py
          componentize-py -d sdk/wit -w kv-consumer bindings sdk/python

      - name: Build Python SDK
        run: |
          cd sdk/python
          poetry build

      - name: Generate Go SDK
        run: |
          rm -rf sdk/go/gen
          wit-bindgen-go generate -w kv-consumer -o sdk/go/gen -p github.com/astorise/Tachyon-Mesh/sdk/go/gen sdk/go/wit

      # "Credential-Gated Publish Steps Fail Closed" (Magnetar precedent):
      # assert each secret is present and non-empty, with an explicit
      # ::error:: message, before the matching publish step runs -- never
      # let an empty token reach the registry as an unauthenticated or
      # malformed request.
      - name: Check crates.io token is configured
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured as a repository secret. Configure it under Settings > Secrets and variables > Actions before dispatching this workflow to publish the Rust SDK for real." >&2
            exit 1
          fi
      - name: Publish Rust SDK (real)
        run: cargo publish --manifest-path sdk/rust/Cargo.toml --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Check npm token is configured
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN is not configured as a repository secret. Configure it under Settings > Secrets and variables > Actions before dispatching this workflow to publish the JavaScript SDK for real." >&2
            exit 1
          fi
      - name: Publish JavaScript SDK (real)
        # Same --prefix fix as the dry-run step above: this one was already
        # broken the same way before this PR, just never run (no gate
        # existed to reach it safely, and no prior CI exercised it).
        run: npm publish ./sdk/js --access public --//registry.npmjs.org/:_authToken="${{ secrets.NPM_TOKEN }}"

      - name: Check PyPI token is configured
        run: |
          if [ -z "${{ secrets.PYPI_TOKEN }}" ]; then
            echo "::error::PYPI_TOKEN is not configured as a repository secret. Configure it under Settings > Secrets and variables > Actions before dispatching this workflow to publish the Python SDK for real." >&2
            exit 1
          fi
      - name: Publish Python SDK (real)
        run: poetry publish --directory sdk/python --username __token__ --password "${{ secrets.PYPI_TOKEN }}"

      - name: Publish Go SDK (real)
        # TACH-41 (2026-10-30 audit): unlike cargo/npm/poetry, a Go module
        # has no package-registry upload step -- the module proxy
        # resolves versions directly from the module's own VCS tags, and
        # for a module living in a monorepo subdirectory that means a
        # "<subdir>/vX.Y.Z" tag, not the repo-root release tag this
        # workflow already runs from. Without this, `go get
        # github.com/astorise/Tachyon-Mesh/sdk/go@v<version>` could never
        # resolve no matter how complete sdk/go's bindings are -- Go
        # wasn't even in this job before this fix.
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-publish-target.outputs.version }}"
          SHA="${{ needs.resolve-publish-target.outputs.sha }}"
          TAG="sdk/go/v${VERSION}"
          existing="$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$SHA" ]; then
              echo "${TAG} already points at ${SHA}; nothing to do."
              exit 0
            fi
            echo "::error::${TAG} already exists on origin but points at ${existing}, not the resolved commit ${SHA}. Refusing to move an existing tag." >&2
            exit 1
          fi
          git tag "${TAG}" "${SHA}"
          git push origin "${TAG}"

  publish-wit-oci:
    name: Publish WIT contracts to GHCR (OCI)
    runs-on: ubuntu-latest
    needs: [resolve-publish-target, verify-tag-ci-green]
    # Unlike the three jobs above, this one stays automatic on a tag push:
    # it authenticates with the ephemeral, repo-scoped GITHUB_TOKEN against
    # GHCR (this repository's own package namespace), never a long-lived
    # external-registry credential -- a materially different, already-
    # contained risk, same as this repo's other GITHUB_TOKEN-scoped publish
    # jobs (ci.yml's publish-docker-images, release.yml's GitHub Release
    # uploads). It is now gated on verify-tag-ci-green regardless (TACH-18),
    # which it previously was not.
    #
    # TACH-33 (2026-10-29 audit): this `if:` used to also accept
    # `github.event_name == 'release'`, and the workflow's own `on:` block
    # (above) listened for `release: types: [published]` as well as the tag
    # push below. A single real tag push fires both: release.yml's own jobs
    # publish the GitHub Release off that same push, which then re-fires
    # this workflow a second time. That meant wkg publish could attempt the
    # same package/version twice. Tag push alone is sufficient -- and is
    # what verify-tag-ci-green's gate already checks against -- so it's now
    # the only trigger for this job, and the `release` trigger was removed
    # from `on:` entirely since nothing else in this file used it.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # TACH-32 follow-up (2026-10-29 audit): this job's own `if:`
          # above checks the *triggering* ref/event, which on a
          # workflow_dispatch reflects whichever ref the dispatch UI
          # happened to be started from -- not necessarily the tag named
          # by `resolve-publish-target`'s `tag` input. Dispatching from
          # tag A's ref while entering a different tag B would otherwise
          # check out A here while verify-tag-ci-green (via
          # resolve-publish-target) verifies B's CI, letting B's green
          # CI authorize publishing A's WIT contracts. Explicitly
          # checking out the resolved SHA removes that mismatch; for an
          # ordinary tag push this resolves to the same commit either way
          # (resolve-publish-target is a no-op there), so this only
          # changes behavior for the workflow_dispatch path.
          ref: ${{ needs.resolve-publish-target.outputs.sha }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install wkg (Wasm Package Tools)
        run: cargo install wkg --version 0.16.1 --locked

      - name: Stage tachyon:mesh's own file into an isolated package root
        # TACH-33 (2026-10-29 audit): `./wit` is a flat directory holding
        # MANY independent WIT packages as siblings of tachyon:mesh
        # (tachyon:identity, tachyon:*-config, tachyon:accelerator,
        # tachyon:storage, ...) -- confirmed by reproducing `wkg publish
        # ./wit --dry-run` directly: it fails WIT resolution with "package
        # identifier `tachyon:ai-config@1.1.0` does not match previous
        # package name of `tachyon:identity@1.1.0`" before ever reaching
        # GHCR, because wkg tries to build the whole directory as one
        # package.
        #
        # An earlier version of this step staged all 10 files that
        # `grep -rl "^package tachyon:mesh@" wit/` finds, including four
        # subdirectories (wit/{mesh,ai,events,store}), preserving their
        # relative paths. `wkg publish --dry-run` against that staged
        # directory built and resolved without error, which looked like
        # proof it worked -- but decoding the actual built package
        # (`wasm-tools component wit <dir> --wasm -o out.wasm`, then
        # `wasm-tools component wit out.wasm`) showed it silently dropped
        # 9 of those 10 files: wit_parser's directory-based build only
        # picks up *.wit files sitting directly in the given directory,
        # never in subdirectories, so "no error" was never proof the
        # subdirectory content was actually included in the package.
        #
        # wit/tachyon.wit alone is the correct, self-sufficient publish
        # target: its own header names it "the single source of truth for
        # all Tachyon Mesh WIT interfaces" and says not to fork worlds or
        # create -with-X variants; it builds standalone with zero
        # resolution errors (verified the same way: build, then decode,
        # and compare against the file's own content); and
        # sdk/wit/tachyon.wit (the consumer-facing SDK subset) never
        # references any interface/world that only the four subdirectories
        # declare. Those subdirectories' files remain referenced elsewhere
        # in the repo by direct path (e.g.
        # crates/parallel-topology/src/lib.rs,
        # scripts/validate_ai_component_boundary.sh) -- they are not dead
        # code, just not part of the externally-published GHCR artifact.
        run: |
          set -euo pipefail
          STAGE_DIR="$(mktemp -d)"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"
          cp wit/tachyon.wit "${STAGE_DIR}/"
          echo "Staged tachyon:mesh file(s) into ${STAGE_DIR}:"
          find "$STAGE_DIR" -name '*.wit' | sort

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry-run preflight (build and resolve, no push)
        # TACH-33 (2026-10-29 audit): catches a broken build/resolve before
        # attempting the real, one-shot publish below.
        run: |
          set -euo pipefail
          # TACH-32 follow-up (2026-10-29 audit): derived from
          # resolve-publish-target's resolved output, not GITHUB_REF --
          # see the checkout step above for why those can differ on a
          # workflow_dispatch.
          VERSION="${{ needs.resolve-publish-target.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          wkg publish \
            --registry ghcr.io \
            --package "${OWNER}:tachyon-mesh-wit@${VERSION}" \
            --dry-run \
            "${STAGE_DIR}"

      - name: Package and publish WIT contracts
        run: |
          set -euo pipefail
          # TACH-32 follow-up (2026-10-29 audit): derived from
          # resolve-publish-target's resolved output, not GITHUB_REF --
          # see the checkout step above for why those can differ on a
          # workflow_dispatch.
          VERSION="${{ needs.resolve-publish-target.outputs.version }}"
          OWNER="${{ github.repository_owner }}"

          echo "Publishing WIT contracts as ghcr.io/${OWNER}/tachyon-mesh-wit:${VERSION}"

          # wkg 0.16.1's `publish` has no separate --namespace/--version
          # flags -- confirmed via `wkg publish --help`: it takes a single
          # combined `<namespace>:<name>@<version>` via --package. The old
          # --namespace/--version invocation would have failed at argument
          # parsing before ever reaching GHCR.
          wkg publish \
            --registry ghcr.io \
            --package "${OWNER}:tachyon-mesh-wit@${VERSION}" \
            "${STAGE_DIR}"

      - name: Verify published artifact
        run: |
          VERSION="${{ needs.resolve-publish-target.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          echo "Published ghcr.io/${OWNER}/tachyon-mesh-wit:${VERSION}"
