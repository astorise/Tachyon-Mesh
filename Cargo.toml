    "examples/guest-grpc",
    "examples/guest-grpc-interop",
    "examples/guest-log-storm",
    "examples/guest-loop",
    "examples/guest-malicious",
    "examples/guest-openai",
    "examples/guest-rag-vector",
    "examples/guest-tcp-echo",
    "examples/guest-websocket-echo",
    "examples/guest-udp-echo",
    "examples/guest-voip-gate",
    "examples/guest-volume",
    "legacy-mock",
    "systems/system-faas-bridge",
    "systems/system-faas-metering",
    "systems/system-faas-storage-broker",
    "systems/system-faas-authn",
    "systems/system-faas-authz",
    "systems/system-faas-k8s-scaler",
    "systems/system-faas-keda",
    "systems/system-faas-logger",
    "systems/system-faas-otel",
    "systems/system-faas-gateway",
    "systems/system-faas-config-api",
    "systems/system-faas-gitops-broker",
    "systems/system-faas-cert-manager",
    "systems/system-faas-cdc",
    "systems/system-faas-cdc-broadcaster",
    "systems/system-faas-dist-limiter",
    "systems/system-faas-enrollment",
    "systems/system-faas-gc",
    "systems/system-faas-gossip",
    "systems/system-faas-prom",
    "systems/system-faas-registry",
    "systems/system-faas-model-broker",
    "systems/system-faas-media-server",
    "systems/system-faas-mesh-overlay",
    "systems/system-faas-microvm-runner",
    "systems/system-faas-node-registry",
    "systems/system-faas-olap-engine",
    "systems/system-faas-buffer",
    "systems/system-faas-s3-proxy",
    "systems/system-faas-shadow-proxy",
    "systems/system-faas-sql-engine",
    "systems/system-faas-openapi",
    "systems/system-faas-sqs",
    "systems/system-faas-tde",
    "systems/system-faas-tee-runtime",
    "systems/system-faas-vector-search",
    "systems/system-faas-view-builder",
    "sdk/rust",
    "tachyon-client",
    "tachyon-ui",
    "tachyon-mcp",
    "turboquant-sys",
]
resolver = "2"

[patch.crates-io]
# Temporary security patches until crates.io releases include quick-xml >= 0.41.
object_store = { git = "https://github.com/apache/arrow-rs-object-store.git", rev = "fd44ebb9c1158660795ec22d7b11acf31c3fe113" }
plist = { git = "https://github.com/ebarnard/rust-plist.git", rev = "0a2f9e79fe4b85abcfb8013a9f3c97e490750b50" }

[profile.release]
# Tachyon brands itself as a high-performance runtime (AI inference, near-zero
# cold start). Optimise for speed rather than size: `opt-level = 3` plus a single
# codegen unit lets fat LTO inline across the whole graph. `strip = "debuginfo"`
# trims the heavy DWARF tables from the operator binary while keeping the symbol
# names that make panic backtraces readable. Trade-off: longer release builds.
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
