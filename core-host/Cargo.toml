[package]
name = "core-host"
version = "1.0.0"
edition = "2021"

[features]
default = ["admin-plane", "ring"]
# Gates the `/admin/*` authenticated HTTP surface (operator dashboard, IAM,
# manifest/canary/chaos control, asset uploads, OpenAPI/Swagger docs) and its
# route mounting in the router. Disabling it (`--no-default-features`) yields
# a "worker data-plane only" binary: no `/admin/*` endpoints are exposed
# (smaller attack surface, faster startup), while the two enrollment-bootstrap
# routes (`/admin/enrollment/start`, `/admin/enrollment/poll/{id}`) stay
# reachable — a worker still needs to be enrollable, and it must remain a
# valid answering peer when a different unenrolled node's outbound enrollment
# call happens to land on it. `/admin/enrollment/approve` (the operator-facing
# PIN approval step) stays gated: approval is expected to happen against an
# admin-plane node via Tachyon Studio.
admin-plane = []
# Candle + TurboQuant + ONNX inference — pure Rust, musl-compatible.
# candle-onnx executes .onnx models; wasmtime-wasi-nn (no ORT) provides the
# WASI-NN guest interface backed by our CandleOnnxBackend.
ai-inference = [
    "dep:candle-core", "dep:candle-nn", "dep:candle-onnx", "dep:candle-transformers",
    "dep:lru", "dep:minijinja", "dep:minijinja-contrib", "dep:parallel-topology", "dep:prost",
    "dep:tokenizers", "dep:turboquant-sys", "dep:wasmtime-wasi-nn",
]
candle-flashinfer = ["ai-inference", "dep:candle-flashinfer-kernels", "candle-transformers/flashinfer-kernels"]
ebpf-loader = ["dep:aya"]
# `experimental` gates unwired v1.1 stubs (QUIC safetensors replication, predictive
# VRAM helpers, BaaS scratch tables) so they are excluded from the default build but
# can still be exercised by integration tests or future wiring work.
experimental = []
fips = ["tokio-rustls/aws_lc_rs", "tokio-rustls/fips"]
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn", "dep:tower", "dep:tokio-stream"]
mtls = []
candle-cuda = [
    "ai-inference",
    "candle-core/cuda",
    "candle-flashinfer-kernels?/cuda",
    "candle-nn/cuda",
    "candle-onnx/cuda",
    "candle-transformers/cuda",
    # Compiles in candle-transformers' paged-attention call site (the
    # cache.set_paged_kv/paged_kv seam added for hardware_strategy.paged_attention);
    # gated behind this feature because it pulls in the CUDA-only
    # candle-flash-attn crate. Does not change runtime behavior on its own —
    # the model only takes the paged path when the host attaches a
    # PagedKvCache via cache.set_paged_kv.
    "candle-transformers/flash-attn",
    "dep:cudarc",
    "dep:nvml-wrapper",
]
# `nvfp4-cuda` stays CPU-buildable (no `candle-core/cuda`) so it remains in the
# standard non-CUDA feature matrix. The candle CUDA backend is activated by the
# separate `candle-cuda` feature (which enables `candle-core/cuda` et al.) and is
# what the parallel dispatch, multi-GPU enumeration, and tensor-parallel
# all-reduce gate on (`#[cfg(feature = "candle-cuda")]`); it is exercised by the
# dedicated `cuda-quality` CI job. The default build stays CUDA-free
# (`default = ["ring"]`) and reproducible without a CUDA toolchain.
nvfp4-cuda = ["ai-inference"]
rate-limit = ["dep:governor", "dep:forwarded-header-value"]
resiliency = ["dep:tower"]
ring = ["tokio-rustls/ring", "tokio-rustls/tls12"]
# Native S3 persistence: restores state on startup, flushes after auth mutations.
# Uses object_store (pure Rust, musl-compatible) — no rclone sidecar needed.
s3-persistence = ["dep:object_store", "dep:futures"]
secrets-vault = []
websockets = ["axum/ws", "dep:futures-util"]

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
async-trait = "0.1"
arc-swap = "1.7"
axum = "0.8"
blake3 = "1.5"
bytes = "1.5"
candle-core = { git = "https://github.com/astorise/candle", tag = "tachyon-v0.11.0-6", version = "0.11.0", optional = true }
candle-flashinfer-kernels = { git = "https://github.com/astorise/candle", tag = "tachyon-v0.11.0-6", version = "0.11.0", optional = true, default-features = false }
candle-nn = { git = "https://github.com/astorise/candle", tag = "tachyon-v0.11.0-6", version = "0.11.0", optional = true }
candle-onnx = { git = "https://github.com/astorise/candle", tag = "tachyon-v0.11.0-6", version = "0.11.0", optional = true }
# Standard transformer architectures (Llama family) for running real, uploaded
# checkpoints. Weights are mmapped from the model directory at runtime — never
# compiled into the Tachyon artifact.
candle-transformers = { git = "https://github.com/astorise/candle", tag = "tachyon-v0.11.0-6", version = "0.11.0", optional = true, default-features = false }
parallel-topology = { path = "../crates/parallel-topology", optional = true }
# Same cudarc version `candle-core`'s CUDA backend already vendors (see
# Cargo.lock), so this reuses one NCCL binding instead of introducing a
# second. Only the `nccl` feature is added on top of whatever candle-core
# already requests; Cargo unifies features across both consumers.
cudarc = { version = "0.19.7", default-features = false, features = ["nccl"], optional = true }
# Pure-Rust, dlopen-based NVML bindings: does not link against
# `libnvidia-ml.so` at build time, so it cannot break CPU-only or
# non-NVIDIA builds even though it is only ever compiled in under
# `candle-cuda`.
nvml-wrapper = { version = "0.12", optional = true }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2"
flate2 = "1"
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
forwarded-header-value = { version = "0.1", optional = true }
globset = "0.4"
governor = { version = "0.10", optional = true }
memmap2 = "0.9"
# Renders Hugging Face `chat_template` (Jinja2) strings for OpenAI-style chat
# requests. `pycompat` adds the Python string methods (e.g. `.strip()`) that
# real instruct templates rely on. Both are gated behind `ai-inference`.
minijinja = { version = "2", optional = true }
minijinja-contrib = { version = "2", optional = true, features = ["pycompat"] }
moka = { version = "0.12", features = ["sync"] }
notify = { version = "8.0", default-features = false, features = ["macos_kqueue"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
hex = "0.4"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio", "http1", "http2"] }
lru = { version = "0.18", optional = true }
object_store = { version = "0.14", optional = true, features = ["aws"] }
prometheus = "0.14"
prost = { version = "0.14", optional = true }
quinn = { version = "0.11.9", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
redb = "4.0"
semver = "1.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.39"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-stream = { version = "0.1", optional = true }
tokenizers = { version = "0.23.0", optional = true, default-features = false, features = ["fancy-regex"] }
tower = { version = "0.5", optional = true, features = ["retry", "timeout", "util"] }
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
system-faas-enrollment = { path = "../systems/system-faas-enrollment" }
system-faas-microvm-runner = { path = "../systems/system-faas-microvm-runner" }
turboquant-sys = { path = "../turboquant-sys", optional = true }
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "46.0.1", features = ["component-model"] }
wasmtime-wasi = { version = "46.0.1", features = ["p1"] }
wasmtime-wasi-nn = { version = "46.0.1", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14.0", optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
hmac = "0.13"
mockall = "0.15"
proptest = "1"
prost = "0.14"
rcgen = "0.14"
tempfile = "3"
tokio-test = "0.4"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
